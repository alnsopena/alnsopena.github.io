  <style id="apple-design-v1">
    :root {
      --ease-fluid: cubic-bezier(.22, 1, .36, 1);
      --press-scale: .985;
      --glass: rgba(255, 255, 255, .82);
      --glass-strong: rgba(255, 255, 255, .94);
      --hairline: rgba(17, 43, 64, .10);
      --focus-ring: rgba(69, 126, 160, .34);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      font-optical-sizing: auto;
    }

    html, body { min-height: 100%; }
    body {
      background:
        radial-gradient(circle at 86% -10%, rgba(203, 167, 133, .17), transparent 30rem),
        linear-gradient(180deg, #f8fafb 0%, #f2f5f7 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .topbar {
      top: 0;
      background: rgba(10, 29, 45, .86);
      border-bottom: 1px solid rgba(255, 255, 255, .14);
      box-shadow: 0 10px 34px -24px rgba(3, 12, 20, .92);
      backdrop-filter: blur(24px) saturate(165%);
      -webkit-backdrop-filter: blur(24px) saturate(165%);
    }
    .topbar::after {
      content: "";
      position: absolute;
      inset: auto 0 -12px;
      height: 12px;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(11, 27, 43, .09), transparent);
    }
    .topinner {
      width: 100%;
      max-width: none;
      height: 72px;
      padding: 0 clamp(16px, 2.2vw, 36px);
      gap: 16px;
    }
    .logo {
      background: rgba(255, 255, 255, .05);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10);
    }
    .review-badge, .board-link {
      background: rgba(255, 255, 255, .08);
      border-color: rgba(255, 255, 255, .18);
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
    }
    .board-link {
      min-height: 40px;
      color: #fff;
      cursor: pointer;
      transition: transform 180ms var(--ease-fluid), background-color 180ms ease, border-color 180ms ease;
    }
    .board-link:hover { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .3); }
    .board-link:active { transform: scale(var(--press-scale)); transition-duration: 80ms; }
    .fullscreen-btn { border-style: solid; }

    .shell {
      width: 100%;
      max-width: none;
      min-height: calc(100vh - 72px);
      margin: 0;
      grid-template-columns: 264px minmax(0, 1fr);
    }
    .sidebar {
      top: 72px;
      height: calc(100vh - 72px);
      padding: 18px 14px;
      background: rgba(248, 250, 251, .78);
      border-right-color: var(--hairline);
      backdrop-filter: blur(24px) saturate(145%);
      -webkit-backdrop-filter: blur(24px) saturate(145%);
    }
    .nav button {
      position: relative;
      overflow: hidden;
      min-height: 46px;
      border-radius: 13px;
      transition: transform 190ms var(--ease-fluid), background-color 190ms ease, color 190ms ease, box-shadow 190ms ease;
    }
    .nav button:hover { transform: translateX(2px); background: rgba(224, 232, 238, .78); }
    .nav button:active { transform: translateX(2px) scale(var(--press-scale)); transition-duration: 80ms; }
    .nav button.active {
      background: linear-gradient(135deg, rgba(18, 42, 64, .98), rgba(28, 61, 87, .98));
      box-shadow: 0 14px 28px -19px rgba(11, 31, 48, .9), inset 0 1px 0 rgba(255, 255, 255, .12);
    }
    .scope {
      background: rgba(255, 255, 255, .64);
      border-color: var(--hairline);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .main { padding: clamp(26px, 3vw, 48px) clamp(18px, 3.4vw, 58px) 64px; }
    .heading h1 {
      font-size: clamp(30px, 3vw, 44px);
      line-height: 1.04;
      letter-spacing: -.038em;
      text-wrap: balance;
    }
    .heading p { font-size: 14px; line-height: 1.58; }

    .card, .rowbtn, .row, .tablewrap, .control, .datebox, .update, .warning {
      border-color: var(--hairline);
    }
    .card, .tablewrap, .rowbtn, .row, .update {
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      box-shadow: 0 18px 48px -34px rgba(15, 42, 62, .55), inset 0 1px 0 rgba(255, 255, 255, .72);
    }
    .card { border-radius: 18px; }
    .card.pad { padding: clamp(18px, 2vw, 24px); }
    .metric-value { font-size: clamp(30px, 2.6vw, 38px); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
    .rowbtn {
      transition: transform 190ms var(--ease-fluid), background-color 190ms ease, border-color 190ms ease, box-shadow 190ms ease;
    }
    .rowbtn:hover {
      transform: translateY(-2px);
      background: var(--glass-strong);
      border-color: rgba(49, 93, 121, .24);
      box-shadow: 0 20px 48px -32px rgba(15, 42, 62, .72), inset 0 1px 0 #fff;
    }
    .rowbtn:active { transform: translateY(0) scale(.992); transition-duration: 80ms; }
    .project-link, .loadmore, .close, .control { transition: transform 170ms var(--ease-fluid), border-color 170ms ease, background-color 170ms ease, box-shadow 170ms ease; }
    .project-link:active, .loadmore:active, .close:active { transform: scale(.97); transition-duration: 80ms; }
    .control { background: rgba(255, 255, 255, .88); border-radius: 12px; }
    .control:focus { border-color: #4d7b95; box-shadow: 0 0 0 4px var(--focus-ring); }
    .table tbody tr { transition: background-color 150ms ease; }
    .table tbody tr:hover { background: rgba(230, 238, 243, .52); }
    .track, .progress { box-shadow: inset 0 1px 2px rgba(23, 51, 71, .10); }
    .fill, .progress i { transition: width 420ms var(--ease-fluid); }

    .dialog {
      border-radius: 22px;
      background: rgba(248, 250, 251, .95);
      box-shadow: 0 36px 100px rgba(3, 14, 23, .42);
      transform-origin: 50% 12%;
    }
    .dialog[open] { animation: materialize 280ms var(--ease-fluid); }
    .dialog::backdrop { background: rgba(5, 14, 23, .5); backdrop-filter: blur(8px) saturate(115%); }
    .dialog-head {
      background: rgba(10, 29, 45, .92);
      backdrop-filter: blur(24px) saturate(155%);
      -webkit-backdrop-filter: blur(24px) saturate(155%);
    }
    @keyframes materialize {
      from { opacity: 0; transform: translateY(10px) scale(.985); filter: blur(3px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    :where(button, a, input, select, summary):focus-visible {
      outline: 3px solid rgba(100, 163, 200, .66);
      outline-offset: 3px;
    }

    @media (max-width: 800px) {
      .topinner { padding: 10px 14px; gap: 10px; }
      .topmeta { margin-left: auto; }
      .topmeta strong { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .fullscreen-btn { display: none; }
      .shell { min-height: calc(100vh - 72px); }
      .sidebar {
        top: 0;
        height: auto;
        padding: 8px 10px;
        background: rgba(248, 250, 251, .9);
        backdrop-filter: blur(20px) saturate(150%);
        -webkit-backdrop-filter: blur(20px) saturate(150%);
      }
      .nav button { min-height: 42px; border-radius: 12px; }
      .nav button:hover { transform: none; }
      .main { padding: 24px 14px 44px; }
      .heading h1 { font-size: clamp(28px, 9vw, 38px); }
      .card { border-radius: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .topbar, .sidebar, .card, .rowbtn, .row, .tablewrap, .update, .dialog-head { backdrop-filter: none; -webkit-backdrop-filter: none; }
      .topbar, .dialog-head { background: #10283c; }
      .sidebar, .card, .rowbtn, .row, .tablewrap, .update { background: #fff; }
    }
    @media (prefers-contrast: more) {
      :root { --hairline: rgba(17, 43, 64, .34); }
      .card, .rowbtn, .row, .tablewrap, .control, .datebox, .update { background: #fff; box-shadow: none; }
    }
  </style>

"assets":[]},{"id":"5566491791","text_body":"21/09: Franklin finalizo el desarrollo del Api de embarcaciones y se realizó el pase a producción el 21/09. Asimismo, se comunico de este pase a Francisco para que realice las actualizaciones respectivas.\n\n\n\nPor otro lado, continuamos a la espera del levantamiento de observaciones enviadas a Francisco el 18/09.","created_at":"2026-09-21T22:14:13.000Z","updated_at":"2026-09-21T22:15:12.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12773879426","replies":[],"assets":[]},{"id":"5566487547","text_body":"21//09: Se realizaron pruebas UAT y se hallaron errores que fueron enviados al proveedor. Se planifica finalizar las pruebas el 23/09.","created_at":"2026-09-21T22:11:49.000Z","updated_at":"2026-09-21T22:11:49.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12002357229","replies":[],"assets":[]},{"id":"5562900810","text_body":"Estado al 20/09: contrato CT0150 en revisión final, pendiente de firma.\n\nEl viernes 18/09 por la tarde se remitieron a Expandia las observaciones consolidadas de Legal y de Gerencia TI: propiedad de COSMOS sobre código, repositorios y documentación; SLA exigibles y no referenciales; penalidad máxima 10%; pago máximo 60% antes del despliegue; garantía mínima de 120 días; retención o carta fianza del 10%; disponibilidad de 99.5% con RTO de 4 horas y RPO de 1 hora; matriz de interfaces con criterios de aceptación; seguridad y tratamiento de datos biométricos; y criterios mínimos de aceptación y Go-Live.\n\nExpandia confirmó recepción el mismo 18/09 y se comprometió a entregar la versión ajustada el 21/09. Aún no ha sido recibida.\n\nSiguiente paso: validar la versión de Expandia contra la matriz de observaciones y elevar a firma. La fecha Fin Plan (30/10/2026) se revisará una vez definida la fecha de firma.","created_at":"2026-09-20T22:38:16.000Z","updated_at":"2026-09-20T22:38:16.000Z","creator":{"id":"99092612","name":"Alonso Pena"},"item_id":"11062536522","replies":[],"assets":[]},{"id":"5557814893","text_body":"17/09: Se tuvo segunda reunión de capacitación de uso de la plataforma de check in por parte de Seidor dirigido a los usuarios de Paita. Los usuarios se comprometieron a entregar las evidencias de pruebas UAT para el 18/09.\n\n\n\nAsimismo, por el lado de proyectos, se revisó las funcionalidades de la plataforma y se hallaron observaciones que se remitieron a Seidor para su pronta solución.","created_at":"2026-09-17T20:56:20.000Z","updated_at":"2026-09-17T20:56:20.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12773879426","replies":[],"assets":[]},{"id":"5553405649","text_body":"16/09: Se programó corte de información para pase a QA el 16/09 en la noche y se realizará la configuración general de esta el 17/09.\n\n\n\nSe iniciaran pruebas UAT con el equipo de Cosmos el 18/09.","created_at":"2026-09-16T17:21:33.000Z","updated_at":"2026-09-16T17:21:33.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12002357229","replies":[],"assets":[]},{"id":"5553397766","text_body":"16/09: Se contacto al proveedor DMS Perú para que nos brinde información sobre sus equipos disponibles. Se programó la reunión de consultas para el 16/09. Se realizará la evaluación de estos teniendo en cuenta las características que Expandía solicitó para la aplicación.\n\n\n\nCaracterísticas solicitadas:\n\n - Sistema operativo: Android 14 como mínimo.\n\n- Tecnología: Compatible con Angular + Ionic/Capacitor.\n- Reconocimiento facial: SDK específico para reconocimiento facial.\n- Cámara: Mínimo de 12 MP.\n- Biometría: Lector ZKTeco SLK20R con conexión USB-C.","created_at":"2026-09-16T17:19:27.000Z","updated_at":"2026-09-16T17:19:27.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12773879426","replies":[],"assets":[]},{"id":"5553376245","text_body":"16/09: Se planificaron pruebas UAT con los usuarios de Paitaa. Deberán entregar sus evidencias de las pruebas realizadas antes del 17/09. Con base en las observaciones encontradas, se realizará una reunión con el proveedor el 18/09 para el levantamiento de dichas observaciones.","created_at":"2026-09-16T17:13:16.000Z","updated_at":"2026-09-16T17:13:16.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12773879426","replies":[],"assets":[]},{"id":"5553367701","text_body":"15/09: Se realizó una reunión con Luis Gatica y G\u0026S para conocer en detalle las características de seguridad de Azure. Se acordó que G\u0026S enviaría una propuesta de mejora en la seguridad de Azure y, con base en esta propuesta, se evaluará junto con Luis Gatica la mejor opción para llevar a cabo la migración a Azure.","created_at":"2026-09-16T17:10:52.000Z","updated_at":"2026-09-16T17:10:52.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12773879426","replies":[],"assets":[]},{"id":"5545259579","text_body":"Kickoff del proyecto 14/09.\n\nPendiente aprobación del 50% de la OC por el esfuerzo de implementación de las integraciones.","created_at":"2026-09-14T14:56:47.000Z","updated_at":"2026-09-14T14:56:47.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"12243759594","replies":[],"assets":[]},{"id":"5521129130","text_body":"El equipo de facturación marítima gestiona actualmente pagos al contado que son solicitados por correo. Con el objetivo de estandarizar este proceso, agradeceré que me comenten qué se requiere para poder gestionarlos a través del portal de pagos actual.\n\nPara avanzar con esto, solicito el siguiente apoyo:\n\n- Equipo de TI: Un encargado para validar los requerimientos técnicos del portal actual.\n- Equipo de Tesorería: Su apoyo para validar en conjunto que este flujo se alinee con el estándar de las atenciones al contado de las otras unidades de negocio.\n\nQuedo atento a sus comentarios para coordinar los siguientes pasos, estos son los servicios actuales que gestiona mi equipo.\n\nENTIDAD\nSERVICIO\n\nAutoridad Portuaria Nacional (APN)\nRecepción y despacho de naves\n\nSanidad Marítima\nRecepción y despacho de las naves\n\nMarina de Guerra del Perú - Direccin DICAPI\nDerecho de Ayudas a la Navegación\n\nAPM terminals Callao\nDerechos de Uso de Muelle , Uso de lanchas, etc\n\nTerminal Portuario Paracas\nUso de Muelle\n\nTransmarina del Perú\nDesembarque/Embarque de Tripulantes\n\nIturri Agente Portuario SAC\nSub agenciamos para la atención de naves en el puerto de ETEN","created_at":"2026-09-04T16:19:39.000Z","updated_at":"2026-09-04T16:19:39.000Z","creator":{"id":"98321015","name":"Milagros Cheel"},"item_id":"12978628465","replies":[],"assets":[]},{"id":"5521126598","text_body":"Portal de Compras (u otro canal adecuado) pueda recibir e integrar las solicitudes de pago que actualmente nos llegan solo por correo electrónico, con el objetivo de asegurar la trazabilidad de cada caso y que las mismas tengan las aprobaciones correspondientes de cada gerencia.\n\nN°\nTipo de Pagos solicitados por correo\n\n1\nPagos Electrónicos SUNAT como Agente de Aduanas (Derechos, Percepción, Multas, etc.)\n\n2\nPagos de Devoluciones de Clientes (cobranzas)\n\n3\nSolicitud de Cheques de gerencia (ret. Judiciales, dudas razonables, etc.)\n\n4\nPagos de Ayudas a la Navegación\n\n5\nPagos Electrónicos SUNAT como OCE/Interviniente (Recepción,Zarpe,Sanidad Recepción, etc.)\n\n6\nPagos de Sanidad Despacho\n\n7\nPagos de Solicitudes de Fondo (anticipos, a rendir, viáticos,etc.)\n\n8\nPagos de Cajas chicas\n\n9\nPagos de Reembolsos de gastos\n\n10\nPagos de SENASA\n\nSaludos","created_at":"2026-09-04T16:19:08.000Z","updated_at":"2026-09-04T16:19:08.000Z","creator":{"id":"98321015","name":"Milagros Cheel"},"item_id":"12978622972","replies":[],"assets":[]},{"id":"5507054023","text_body":"Se envió las observaciones al contrato en coordinación con el área legal. El proveedor se encuentra igualmente revisando las observaciones del contrato, igualmente pendiente el gantt a la fecha","created_at":"2026-08-31T19:20:16.000Z","updated_at":"2026-08-31T19:20:16.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"12243759594","replies":[],"assets":[]},{"id":"5507046055","text_body":"Se envió un recordatorio al cliente.\n\nMis mayor actividad a la fecha","created_at":"2026-08-31T19:18:27.000Z","updated_at":"2026-08-31T19:18:27.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"11061239961","replies":[],"assets":[]},{"id":"5495274955","text_body":"Ultima actualización de la propuesta de integraciones que no incluye la integración de SINTAD con el TMS (exceptuado por el proveedor) Se estima por esta implementación 1k adicional\n\n","created_at":"2026-08-26T22:39:17.000Z","updated_at":"2026-08-26T22:41:48.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"12243759594","replies":[],"assets":[{"id":"3206894707","name":"image.png","url":"https://cosmos-digital-transformation.monday.com/protected_static/33168202/resources/3206894707/image.png","file_extension":".png","file_size":294858,"created_at":"2026-08-26T22:39:07Z"}]},{"id":"5494276851","text_body":"@Juan Pablo Arbulú  detallar en las columnas capex/opex","created_at":"2026-08-26T18:18:27.000Z","updated_at":"2026-08-26T18:18:27.000Z","creator":{"id":"97963666","name":"Pierre Lozano"},"item_id":"11941507121","replies":[],"assets":[]},{"id":"5494275554","text_body":"@Alonso Pena  detallar en las columnas capex/opex","created_at":"2026-08-26T18:18:06.000Z","updated_at":"2026-08-26T18:18:06.000Z","creator":{"id":"97963666","name":"Pierre Lozano"},"item_id":"11820220046","replies":[],"assets":[]},{"id":"5494274303","text_body":"@Valeria Hermoza detallar en las columnas capex/opex","created_at":"2026-08-26T18:17:48.000Z","updated_at":"2026-08-26T18:17:48.000Z","creator":{"id":"97963666","name":"Pierre Lozano"},"item_id":"12002357229","replies":[],"assets":[]},{"id":"5485955067","text_body":"Se envio a aprobación el documento de especificación a las gerencias involucradas, teniendo respuestas de las gerencia de Transportes y Aduanas, (falta respuesta de GAF)\n\n","created_at":"2026-08-24T14:30:35.000Z","updated_at":"2026-08-24T14:30:35.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"12243759594","replies":[],"assets":[]},{"id":"5485930085","text_body":"Se sostuvo reunión el miércoles 19/08 con el cliente HUAWEI quien manifiesta no tener disponibles los datos solicitados por el sistema, pero creen que pueden incluirla y nos responderian esta semana para avanzar con la integración de sus ordenes","created_at":"2026-08-24T14:24:58.000Z","updated_at":"2026-08-24T14:24:58.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"11061239961","replies":[],"assets":[]},{"id":"5479231629","text_body":"20/08: Se realizó una sesión de trabajo con Johnny para la revisión y estructuración del proceso. Se identificaron actividades, puntos pendientes y oportunidades de mejora.","created_at":"2026-08-20T22:33:41.000Z","updated_at":"2026-08-20T22:33:41.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"11942011799","replies":[],"assets":[]},{"id":"5468639017","text_body":"Se colocó en Stand by por dar prioridad al proceso de compras.","created_at":"2026-08-18T05:31:06.000Z","updated_at":"2026-08-18T05:31:06.000Z","creator":{"id":"105272946","name":"Johnny Abarca"},"item_id":"12556214243","replies":[],"assets":[]},{"id":"5468495008","text_body":"Se avanzó con lo siguiente:\n1. Definición del macroproceso:\n 1.1. Rendición de gastos\n 1.3. Asignación de caja chica\n\nSe cuenta con el diagrama de proceso de Rendición de gastos y solicitud de fondos que faltan validar con los usuario. Se indicó que el 18/08 se revisará el flujo.\n","created_at":"2026-08-18T02:52:25.000Z","updated_at":"2026-08-18T02:52:25.000Z","creator":{"id":"105272946","name":"Johnny Abarca"},"item_id":"11043427692","replies":[],"assets":[]},{"id":"5468244245","text_body":"Se realizaron los siguientes cambios:\n\n1. Cotización de clientes\nSe validó con Renzo el flujo de cotización y falta validar lo de Aduana con Deckner Campusano. Se ha confirmado la reunión para el 19/08.\n\n2. Creación de código de servicio\nSe validó la información con Renzo el flujo de proceso de creación de código del servicio el día viernes 14/08. Se está coordinando para el viernes 21/08 una reunión con el equipo de Finanzas y contabilidad para revisar parte del flujo de automatización de cuentas contable.\n\n3. Liquidación del servicio\nSe mantuvo una reunión con facturación Jenny e Italo para ver el flujo. Falta levantar la parte de la operación maritima - Falta validar\n\n4. Integración con sistemas terceros\nSe está incluyendo el proceso con la integración con sistemas terceros asociado al sub proceso de trazabilidad - Falta validar\n\n5. Trazabilidad del servicio\nEl flujo pendiente de crear.","created_at":"2026-08-17T23:19:44.000Z","updated_at":"2026-08-17T23:19:44.000Z","creator":{"id":"105272946","name":"Johnny Abarca"},"item_id":"11043402746","replies":[],"assets":[]},{"id":"5468133699","text_body":"Recién se visualiza como tarea para procesos.\nSe requiere reunión para definir del alcance con equipo PM @Pierre Lozano.","created_at":"2026-08-17T22:34:49.000Z","updated_at":"2026-08-17T22:34:49.000Z","creator":{"id":"105272946","name":"Johnny Abarca"},"item_id":"12063932150","replies":[],"assets":[]},{"id":"5468062707","text_body":"Recién se visualiza como tarea para procesos.\nSe requiere reunión para definir del alcance con equipo PM @Pierre Lozano.\n","created_at":"2026-08-17T22:07:13.000Z","updated_at":"2026-08-17T22:07:13.000Z","creator":{"id":"105272946","name":"Johnny Abarca"},"item_id":"11041978965","replies":[],"assets":[]},{"id":"5467997557","text_body":"Se realizó el levantamiento del proceso a Lady Talledo (Jefa de Compras)\nSe está cambiando 02 procesos dentro del flujo (Transferencia entre almacén e Inventario) que se presentará el día 18/08.\nSe espera presentar el flujo el jueves 20/08 a @Milagros Cheel y @Pierre Lozano para su validación antes de la presentación con Giancarlo Cabello","created_at":"2026-08-17T21:41:22.000Z","updated_at":"2026-08-17T21:41:22.000Z","creator":{"id":"105272946","name":"Johnny Abarca"},"item_id":"11062401044","replies":[],"assets":[]},{"id":"5467982156","text_body":"1. Onboarding de cliente:\nSe realizó la presentación a Giancarlo Cabello el 12/08, durante la presentación se sugirió algunos cambios que ya se realizaron. Solo falta la firma de aprobación.\n\n2. Alta de proveedores:\nSe adjunta en el proceso el diagrama de flujo realizado.\nPor confirmar reunión (Giancarlo Cabello) para el 21/08.\nPor confirmar fecha de revisión con @Milagros Cheel y @Pierre Lozano\n\n3. Creación de código de servicio:\nSe adjunta en el proceso el diagrama de flujo realizado.\nSe revisó el proceso con Renzo Larrauri y Johnny Saldaña.\nPor confirmar fecha de revisión con @Milagros Cheel y @Pierre Lozano ","created_at":"2026-08-17T21:37:08.000Z","updated_at":"2026-08-17T21:37:08.000Z","creator":{"id":"105272946","name":"Johnny Abarca"},"item_id":"11942011799","replies":[],"assets":[]},{"id":"5467045757","text_body":"17/08: Se acordó con Raúl realizar reuniones de seguimiento todos los viernes para revisar el avance y las actualizaciones del proyecto.","created_at":"2026-08-17T17:43:38.000Z","updated_at":"2026-08-17T17:43:38.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12002357229","replies":[],"assets":[]},{"id":"5461653984","text_body":"Queda pendiente para revisión interna el ticket de defecto https://cosmos-digital-transformation.monday.com/item/D-521","created_at":"2026-08-14T16:29:32.000Z","updated_at":"2026-08-14T16:29:43.000Z","creator":{"id":"99092612","name":"Alonso Pena"},"item_id":"11041978965","replies":[{"id":"5461654485","text_body":"@Juan Pablo Arbulú @Pierre Lozano ","created_at":"2026-08-14T16:29:43.000Z","updated_at":"2026-08-14T16:29:43.000Z","creator":{"id":"99092612","name":"Alonso Pena"}}],"assets":[]},{"id":"5461433671","text_body":"Comentarios: 14/08/2026\n1.- Falta actualizar el proceso de como es el flujo cuando el proveedor seleccionará trabajos/servicios realizados por RxH\n\n@Johnny Abarca\n\n2.- OC 142906 pendiente de aprobar por las mejoras adicionales por USD 2800.00, el proveedor SmartCode insiste que los trabajos son con el 50% de adelante pero en esta ocasión basta con el envío de la OC. Es importante se realice ello.\n\n3.- En configuración el storage account para administrar los documentos cargador en el portal desde nuestra suscripción en Azure.","created_at":"2026-08-14T15:37:09.000Z","updated_at":"2026-08-14T15:40:02.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"11041988731","replies":[],"assets":[]},{"id":"5454702627","text_body":"Buenos días @Johnny Abarca ya contamos en el proceso 100% levantado?","created_at":"2026-08-12T16:54:00.000Z","updated_at":"2026-08-12T16:54:00.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"11942011799","replies":[],"assets":[]},{"id":"5454118198","text_body":"El 11/08 Raúl envío el cronograma en el cual indica que iniciará el desarrollo el 17/08 y propone salir en vivo el 23/09.","created_at":"2026-08-12T14:35:14.000Z","updated_at":"2026-08-12T14:35:14.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12002357229","replies":[],"assets":[]},{"id":"5452047726","text_body":"Se tuvo reunión para revisar alcance de los tickets entre Baufest y Cosmos\n\n\nTemas tratados\n\n* D-501 – Avisos de visibilidad de llegada: Se revisaron las diferencias entre el aviso descargado y el enviado por correo, el logo faltante en la descarga y las cláusulas que deben mostrarse según la línea naviera.\nhttps://cosmos-digital-transformation.monday.com/item/D-501\n\n* D-501 – Configuración de direccionamientos: Se requiere que los direccionamientos y depósitos por defecto sean configurables según la línea naviera y sucursal.\nhttps://cosmos-digital-transformation.monday.com/item/D-501\n\n* D-501 – Links de direccionamiento y registro de desglose: Los enlaces deben apuntar a Cosmos Connect y no a la plataforma anterior.\nhttps://cosmos-digital-transformation.monday.com/item/D-501\n\n* D-501 – Correo de atención al cliente: El correo mostrado en los avisos debe obtenerse según la configuración del puerto o sucursal de operación.\nhttps://cosmos-digital-transformation.monday.com/item/D-501\n\n* D-522 – Homogenización de campos: Aplicar trim al inicio y final de los campos de texto libre antes de validar, guardar y transmitir la información.\nhttps://cosmos-digital-transformation.monday.com/item/D-522\n\n* D-521 – Autenticación en External Connect: Se identificó que algunos usuarios ingresan sin código de verificación. El caso requiere revisión con Infraestructura/Azure para asegurar un comportamiento uniforme.\nhttps://cosmos-digital-transformation.monday.com/item/D-521\n\n* D-515 – Creación masiva de equipos: Se requiere revisar la carga masiva de equipos, debido a registros creados sin información de “dueño de equipo”.\nhttps://cosmos-digital-transformation.monday.com/item/D-515\n\n* Doble envío de manifiesto, pago ASBANC y daños en contenedores: Se mantienen como temas pendientes de validación. No se les asigna ticket en esta sección porque no se identificó un movimiento realizado hoy hacia “Requiere definición de Cosmos”.","created_at":"2026-08-11T20:12:12.000Z","updated_at":"2026-08-11T20:12:12.000Z","creator":{"id":"99092612","name":"Alonso Pena"},"item_id":"11041978965","replies":[],"assets":[]},{"id":"5450771616","text_body":"Sistema debe incluir una validación de cierre de operaciones de aduanas o cualquier unidad de negocio y que gatille la siguiente actividad","created_at":"2026-08-11T15:44:36.000Z","updated_at":"2026-08-11T15:44:36.000Z","creator":{"id":"98321015","name":"Milagros Cheel"},"item_id":"11043402746","replies":[],"assets":[]},{"id":"5450697704","text_body":"Se adjunta logotipo e isotipo Cosmos Logotipo e Isotipo.rar","created_at":" Lozano"}}],"assets":[]},{"id":"5422628616","text_body":"Hoy 31/07 ya se tuvo la aprobación final por parte de Cristina.\nEl día lunes 03/08, Raúl Manturrano compartirá el cronograma de actividades.","created_at":"2026-07-31T17:55:00.000Z","updated_at":"2026-07-31T17:55:00.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"12002357229","replies":[],"assets":[]},{"id":"5422416050","text_body":"Sin actividades al respecto en esta semana.","created_at":"2026-07-31T17:01:29.000Z","updated_at":"2026-07-31T17:01:29.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"11061239961","replies":[],"assets":[]},{"id":"5422414498","text_body":"Convendría por estrategia abordar el alcance únicamente para solicitudes de fondos y rendiciones de gastos de temas administrativos. Dejando la parte operativa para el inmediato siguiente momento (Mismo que se viene aun relevando por el equipo de procesos)\n\nSe precisó al equipo de procesos que el proyecto de \"Migración del TMS\" tiene cierto alcance al respecto lo que actualmente es denominado 'caja chica' y es gestionado actualmente por Sicer.\n\nHoy deben enviar el proceso de Caja chica de gastos de transporte para validar su alcance con el proyecto de \"Migración del TMS\".\n\n\n\n","created_at":"2026-07-31T17:00:58.000Z","updated_at":"2026-07-31T17:00:58.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"11043427692","replies":[],"assets":[]},{"id":"5422320901","text_body":"Se concluyo con las validaciones de integración con el proveedor, con la cual el proveedor tiene claro el alcance al respecto y actualizará su propuesta al respecto al esfuerzo de las integraciones. Gamma Actualizado\n\nMe encuentro actualizando las especificaciones para enviarlas al proveedor.","created_at":"2026-07-31T16:31:08.000Z","updated_at":"2026-07-31T16:31:08.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"12243759594","replies":[],"assets":[]},{"id":"5421888667","text_body":"El proveedor SmartCode envía la propuesta con los nuevos requerimientos\n$ 2800.00 el control de cambio.\n$ 120.00 recurrente por que se ampliará el almacenamiento de documentos.\n\nLas funcionalidades incluidas son:\n\n1.- Pantalla de documentos relacionados a la OC –\no El usuario podrá colocar el nro. de OC y el portal mostrará todos los documentos\nrelacionados a la misma para visualización y descarga.\n2.- Módulo de aprobación de actas de conformidad según el flujo siguiente:\n3.- Generación de pdf con firmas guardadas De la aceptación.\n4.- Validación si se carga FT o RxH (pendiente por enviar el proceso de RxH por procesos)\n\nEl tiempo de implementación sería 29/08 pero es importante cuanto antes su aprobación.\n\nAún no se agrega en el cuadro del monday porque estamos a la espera de la aprobación para registrarlo.","created_at":"2026-07-31T14:55:55.000Z","updated_at":"2026-07-31T14:55:55.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"11041988731","replies":[],"assets":[]},{"id":"5408200848","text_body":"@Pierre Lozano ,\nSe tuvo la reunión de entendimiento con el proveedor SmartCode y de manera general es viable.\nRequiere que le puedan compartir el alcance funcional a fin que pueda revisar a detalle de manera técnica los procesos, reportes involucrados y pueda darnos una propuesta adecuada.","created_at":"2026-07-27T20:38:02.000Z","updated_at":"2026-07-27T20:38:02.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"12063932150","replies":[],"assets":[]},{"id":"5407406728","text_body":"Se tuvo la reunión el día 24/07, según lo acordado, el sistema no validaría lo que hay dentro del documento, pero en la sesión Cristina indicó que lo que había entendido es que el sistema realizaría todas las validaciones incluyendo el contenido.\n\nEs por ello, que se requiere un nuevo levantamiento a detalle, validación de documentos, tipos de documentos y reglas que se le debe indicar al sistema para que sea un registro valido.\n\nLa tarea está realizando el equipo de procesos @Johnny Abarca .\nIgual se le ha indicado al proveedor pueda estimar los demás puntos mostrados para no detenernos.\n\n","created_at":"2026-07-27T17:37:00.000Z","updated_at":"2026-07-27T17:37:00.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"11041988731","replies":[],"assets":[]},{"id":"5402483708","text_body":"También se requiere reunión con ITConsol para solicitar cambio en el proceso de OC y sea consumido por el portal de Proveedores.","created_at":"2026-07-24T16:40:57.000Z","updated_at":"2026-07-24T16:40:57.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"11041988731","replies":[],"assets":[]},{"id":"5402318359","text_body":"En la implementación de la propuesta con SINTAD se identificaron algunos procesos adicionales involucrados como la generacion de Ordenes de venta que intercatua con SAP, la cual se realizó la especificacion y envio al proveedor para su atención.\n\nEn coordinaciones con ellos se viene aterrizando el alcance de esta segunda API necesaria para el API de ordenes.\n\nSe estima tener la proxima semana esta respuesta. (Hoy se tiene un reunion por la tarde)\n\nPor el lado del cliente aun no se tiene respuesta sobre los alcances solicitados: dato de Tipo de carga, Tipo de área, entre otros.\n\nHoy se enviará un recordatorio.","created_at":"2026-07-24T15:54:15.000Z","updated_at":"2026-07-24T15:54:15.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"11061239961","replies":[],"assets":[]},{"id":"5402273190","text_body":"Sin actividades al respecto en la ultima semana.","created_at":"2026-07-24T15:48:00.000Z","updated_at":"2026-07-24T16:03:00.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"11043427692","replies":[{"id":"5402353541","text_body":"El ToBe lo estamos levantando desde el día lunes 20. Por temas de cierre Contabilidad nos esta pidiendo recién agendar reuniones a partir de la próxima (a partir del 30/07). E T15:01:54.000Z","updated_at":"2026-04-21T15:01:54.000Z","creator":{"id":"101884215","name":"Miembro eliminado"},"item_id":"11043402746","replies":[],"assets":[]},{"id":"5169678541","text_body":"Proveedor envío propuesta para realizar la integración con SAP por $ 960 el 14/04.\n\n\n\nPendiente de aprobación.","created_at":"2026-04-21T14:56:12.000Z","updated_at":"2026-05-06T16:27:07.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"11941507121","replies":[],"assets":[]},{"id":"5107929061","text_body":"Hoy 16.04.2026 se realizó el pago correspondientes para el inicio del proyecto.\nSe inicia con la preparación del cronograma con las fechas reales.","created_at":"2026-04-16T14:39:37.000Z","updated_at":"2026-04-16T14:39:37.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"11700862400","replies":[],"assets":[]},{"id":"5107926412","text_body":"Hoy 16.04.2026 se realizó el pago correspondientes para el inicio del proyecto.\nSe inicia con la preparación del cronograma con las fechas reales.","created_at":"2026-04-16T14:39:06.000Z","updated_at":"2026-04-16T14:39:06.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"11041988731","replies":[],"assets":[]},{"id":"5099566691","text_body":"Situación Actual:\n\nRiesgos:\nAdministrativos: retraso en la aprobación y envío de las OC correspondiente","created_at":"2026-04-14T19:14:57.000Z","updated_at":"2026-04-14T19:14:57.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"11061239961","replies":[],"assets":[{"id":"2900152141","name":"image.png","url":"https://cosmos-digital-transformation.monday.com/protected_static/33168202/resources/2900152141/image.png","file_extension":".png","file_size":94807,"created_at":"2026-04-14T19:12:35Z"}]},{"id":"5099556912","text_body":"Escenario anterior:\n\nEl proceso de registro de una orden se encuentra partido. La cabecera normalmente se registra en el TRACKING y sus detalles lo hace en el SINTAD. Estos detalles son registrados posteriormente luego de un proceso de sincronización automático con el SINTAD.\n\nImplementar un Web Services (WS) para la creación automática de una orden de servicio debe registrar en cabecera y detalle en una sola transacción para como resultado de ella devolver el numero de la orden creada.\n\nLa implementación contendría.\n\n* Un WS para recibir las solicitudes y registrarlo en el TRACKING.\n* El RPA síncrono realizará el registro de la cabecera en el tracking y devolverá el numero de la orden de servicio del TRACKING.\n* Otro RPA asíncrono terminará de realizar los detalles en el SINTAD.\n* Un WS para obtener los documentos del cliente y registrarlos en el TRACKING\nRiesgos identificados:\n\nEn el registro de SINTAD pueden presentarse observaciones o inconsistencias que necesiten coordinarse manualmente y deberá considerarse notificaciones a usuarios.\n\n\n\nEn revisión técnica con el ambiente de pruebas dispuestos del Tracking, la generación de una orden de servicio ejecuta adicionalmente varios proceso en back que complementan la creación como: Envío de OV a SAP, identificación de documentos correspondientes según el régimen, generación de incidencias, entre otros.","created_at":"2026-04-14T19:12:19.000Z","updated_at":"2026-04-14T19:12:19.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"11061239961","replies":[],"assets":[]},{"id":"5485943244","text_body":"No se obtuvo respuesta del cliente ni del usuario.\n\nSe procedió a comunicar la desestimación del proyecto el miércoles 19/08 por correo.","created_at":"2026-08-24T14:28:01.000Z","updated_at":"2026-08-24T14:28:01.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"12467678858","replies":[],"assets":[]},{"id":"5450427946","text_body":"Se envió al Cliente un recordatorio para el envío de información para actualizar la especificación técnica de diseño para la implementación del Cliente API y envío de facturas a TOTTUS.\n\n*Esta demora afecta a la fecha fin d o a SAP para DT (Deposito Temporal)","created_at":"2026-08-11T15:45:51.000Z","updated_at":"2026-08-11T15:45:51.000Z","creator":{"id":"99222665","name":"Carlos Caycho Martinez"}},{"id":"5532388613","text_body":"21/08 envio cotizacion proveedor primera fase Facturacion DT\n\n21/08 generacion de SE\n\n01/09 avance proveedor del modulo, a espera de la generacion de la OC\n\n04/09 generacion de la OC y programacion de pago\n\n07/09 abono primera fase\n\n07/09-11/09 prueba de conectividad entre el depot360DT-SAP, envios de facturas","created_at":"2026-09-09T14:22:20.000Z","updated_at":"2026-09-09T14:23:06.000Z","creator":{"id":"99222665","name":"Carlos Caycho Martinez"}},{"id":"5572391479","text_body":"21/09 proveedor realizo prueba de interfaz entre el depot360 y SAP, validando generacion de documento en EFACT, esta adecuando el sistema para permitir generacion de documentos manuales","created_at":"2026-09-23T15:39:33.000Z","updated_at":"2026-09-23T15:39:33.000Z","creator":{"id":"99222665","name":"Carlos Caycho Martinez"}}],"assets":[]},{"id":"5377225552","text_body":"Respecto a las especificaciones de las APIs se envió el 10/07 observaciones y se esta a la espera de respuestas sobre errores identificados en los documentos proporcionados. Hoy se envio un recordatorio.\n\nRespecto a la implementación en la aplicación se realizara sobre el TRACKING.","created_at":"2026-07-15T16:49:44.000Z","updated_at":"2026-07-15T16:49:44.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"12467678858","replies":[],"assets":[]},{"id":"5353389950","text_body":"Luego de reuniones con los usuarios de COSMOS y equipo técnico de Tottus, estamos elaborando el documento de especificación para su envío al proveedor.\n\nSe identifican algunos cambios en el proceso operativo para determinar la relación de las referencias con la factura comercial.\n\nSe distinguen dos etapas una para enviar la factura comercial y otra para enviar las liquidaciones.","created_at":"2026-07-07T15:16:4   const fmtDate=x=>{if(!x)return'Sin dato';const d=new Date(String(x).length===10?x+'T12:00:00Z':x);return isNaN(d)?esc(x):new Intl.DateTimeFormat('es-PE',{timeZone:'America/Lima',day:'2-digit',month:'short',year:'numeric'}).format(d)};
  const fmtDT=x=>{const d=new Date(x);return new Intl.DateTimeFormat('es-PE',{timeZone:'America/Lima',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)+' · Lima'};
  const fmtNum=x=>new Intl.NumberFormat('es-PE',{maximumFractionDigits:2}).format(x);

  function metric(label,value,note,className=''){return'<article class="card pad '+esc(className)+'"><div class="metric-label">'+esc(label)+'</div><div class="metric-value">'+esc(value)+'</div><div class="metric-note">'+esc(note)+'</div></article>'}
  function renderResumen(){const items=D.items,act=items.filter(active),closed=items.filter(i=>val(i,C.status)==='Cerrado'),attention=act.filter(i=>attentionReasons(i).length),risks=act.filter(i=>{const x=(val(i,C.risk)||'').toLowerCase();return x.includes('riesgo')||x.includes('alerta')}),blockers=act.filter(i=>{const x=(val(i,C.risk)||'').toLowerCase();return x.includes('bloqueo')&&!x.includes('sin bloqueo')}),currentYear=String(new Date(D.extracted_at_utc).getFullYear()),executedByYear={};closed.forEach(i=>{const c=closureInfo(i),y=c&&c.year?String(c.year):'';if(/^\d{4}$/.test(y))executedByYear[y]=(executedByYear[y]||0)+1});const annual=Object.entries(executedByYear).sort((a,b)=>Number(a[0])-Number(b[0])),annualMax=Math.max(1,...annual.map(([,n])=>n)),executedCurrent=executedByYear[currentYear]||0,missingClosure=closed.filter(i=>!closureInfo(i)).length,audited=closed.filter(i=>!val(i,C.real)&&closureInfo(i)).length;const due=act.filter(i=>val(i,C.plan)).sort((a,b)=>val(a,C.plan).localeCompare(val(b,C.plan))).slice(0,6);return head('Control ejecutivo','Portafolio Ejecutivo de Proyectos de IT','Proyectos activos, cierres registrados y excepciones del último corte de monday.')+'<section class="grid kpis">'+metric('Proyectos activos',act.length,items.length+' proyectos totales','kpi-primary')+metric('Ejecutados '+currentYear,executedCurrent,'Desplegados o en producción por año de cierre')+metric('Con riesgo',risks.length,'Activos con riesgo o alerta')+metric('Con bloqueo',blockers.length,'Activos con bloqueo registrado')+'</section><section class="grid section-grid"><article class="card pad"><h2 class="section-title">Proyectos ejecutados por año</h2><p class="section-note">Fin Real cuando existe; si está vacío, se usa el año del cambio a Cerrado registrado en la bitácora de monday. '+audited+' cierre(s) recuperado(s) de bitácora.'+(missingClosure?' '+missingClosure+' cierre(s) aún no tienen evidencia suficiente.':'')+'</p>'+(annual.length?'<div class="bars">'+annual.map(([y,n])=>'<div class="barrow"><strong>'+esc(y)+'</strong><div class="track"><div class="fill" style="width:'+pct(n,annualMax)+'%"></div></div><span>'+n+'</span></div>').join('')+'</div>':'<div class="empty annual-empty">Todavía no hay cierres con año verificable.</div>')+'</article><article class="card pad"><div class="split-title"><div><h2 class="section-title">Centro de atención</h2><p class="section-note">Riesgos, bloqueos y vencimientos sin doble conteo.</p></div><span class="count">'+attention.length+'</span></div><div class="list">'+(attention.map(i=>'<button class="rowbtn" onclick="openProject(\''+i.id+'\')"><div class="rowtop"><span class="rowtitle">'+esc(i.name)+'</span>'+statusPill(val(i,C.status))+'</div>'+pills(attentionReasons(i).map(x=>[x,x.startsWith('Riesgo:')?'amber':'red']))+'</button>').join('')||'<div class="empty">Sin alertas actuales</div>')+'</div></article></section><section class="card pad" style="margin-top:18px"><h2 class="section-title">Próximos fines planificados</h2><p class="section-note">Ordenados por Fin Plan; los vencidos se señalan como excepción.</p><div class="list">'+due.map(i=>'<button class="rowbtn" onclick="openProject(\''+i.id+'\')"><div class="rowtop"><span><span class="rowtitle">'+esc(i.name)+'</span><span class="subtle">'+esc(val(i,C.pm)||'PM sin dato')+' · '+esc(val(i,C.phase)||'Fase sin dato')+'</span></span><span class="pill '+(past(val(i,C.plan))?'red':'blue')+'">'+fmtDate(val(i,C.plan))+(past(val(i,C.plan))?' · vencido':'')+'</span></div></button>').join('')+'</div></section>'}

  function filtered(){return D.items.filter(i=>(!state.search||(i.name+' '+i.id+' '+(val(i,C.provider)||'')).toLowerCase().includes(state.search.toLowerCase()))&&(!state.status||val(i,C.status)===state.status)&&(!state.priority||val(i,C.priority)===state.priority)&&(!state.pm||val(i,C.pm)===state.pm))}
  function setFilter(k,v){state[k]=v;renderPortBody()}
  function portTable(items){return'<div class="desktop-table tablewrap"><table class="table"><thead><tr><th>Proyecto</th><th>Estatus</th><th>Prioridad</th><th>PM</th><th>Avance</th><th>Fase</th><th>Fin Plan</th><th>Cierre</th></tr></thead><tbody>'+items.map(i=>'<tr><td>'+projectButton(i)+'</td><td>'+statusPill(val(i,C.status))+'</td><td>'+esc(val(i,C.priority)||'Sin dato')+'</td><td>'+esc(val(i,C.pm)||'Sin dato')+'</td><td><strong>'+(num(i,C.progress)===null?'Sin dato':num(i,C.progress)+'%')+'</strong><div class="progress"><i style="width:'+(num(i,C.progress)||0)+'%"></i></div></td><td>'+esc(val(i,C.phase)||'Sin dato')+'</td><td>'+fmtDate(val(i,C.plan))+'</td><td>'+closureLabel(i)+(closureInfo(i)&&closureInfo(i).source!=='fin_real'?'<span class="closure-audit">Cambio a Cerrado</span>':'')+'</td></tr>').join('')+'</tbody></table></div><div class="mobile-cards">'+items.map(i=>'<button class="rowbtn" onclick="openProject(\''+i.id+'\')"><div class="rowtop"><span><span class="rowtitle">'+esc(i.name)+'</span><span class="id">ID '+i.id+'</span></span>'+statusPill(val(i,C.status))+'</div><div class="dates"><div class="datebox"><span>PM</span><strong>'+esc(val(i,C.pm)||'Sin dato')+'</strong></div><div class="datebox"><span>Cierre</span><strong>'+closureLabel(i)+'</strong></div></div></button>').join('')+'</div>'}
  function renderPortafolio(){return head('Inventario','Portafolio de proyectos','Busca y combina filtros. Selecciona un proyecto para revisar sus campos, subelementos, actividad y documentos.')+'<section class="filters"><input class="control" aria-label="Buscar" placeholder="Buscar proyecto, ID o proveedor" value="'+esc(state.search)+'" oninput="setFilter(\'search\',this.value)"><select class="control" onchange="setFilter(\'status\',this.value)">'+options(C.status,'Todos los estatus')+'</select><select class="control" onchange="setFilter(\'priority\',this.value)">'+options(C.priority,'Todas las prioridades')+'</select><select class="control" onchange="setFilter(\'pm\',this.value)">'+options(C.pm,'Todos los PM')+'</select></section><div id="port-body"></div>'}
  function renderPortBody(){const el=document.getElementById('port-body');if(!el)return;const items=filtered();el.innerHTML='<p class="section-note" style="margin:0 0 10px">'+items.length+' de '+D.items.length+' proyectos</p>'+(items.length?portTable(items):'<div class="empty">No hay coincidencias con los filtros.</div>')}
  function renderAtencion(){const items=D.items.filter(i=>attentionReasons(i).length);return head('Decisión ejecutiva','Centro de atención','Proyectos activos con riesgos, bloqueos, Fin Plan vencido o acciones vencidas no resueltas.')+(items.length?'<section class="grid attention-grid">'+items.map(i=>'<article class="card alert-card"><div class="rowtop"><div>'+projectButton(i)+'</div>'+statusPill(val(i,C.status))+'</div>'+pills(attentionReasons(i).map(x=>[x,x.startsWith('Riesgo:')?'amber':'red']))+'<div class="dates"><div class="datebox"><span>Tipo registrado</span><strong>'+esc(val(i,C.risk)||'Sin dato')+'</strong></div><div class="datebox"><span>Fin Plan</span><strong>'+fmtDate(val(i,C.plan))+'</strong></div><div class="datebox"><span>Acción o decisión</span><strong>'+esc(val(i,C.action)||'Sin dato')+'</strong></div><div class="datebox"><span>Responsable</span><strong>'+esc(val(i,C.actionOwner)||'Sin dato')+'</strong></div></div></article>').join('')+'</section>':'<div class="empty">No hay proyectos que requieran atención.</div>')}
  function renderCronograma(){const items=D.items.slice().sort((a,b)=>(val(a,C.plan)||'9999').localeCompare(val(b,C.plan)||'9999'));return head('Fechas con semántica','Cronograma','Inicio, línea base aprobada, estimación vigente y cierre efectivo se presentan por separado.')+'<div class="tablewrap"><table class="table"><thead><tr><th>Proyecto</th><th>Inicio</th><th>Fin Plan</th><th>Fin Forecast</th><th>Fin Real</th><th>Subelementos</th></tr></thead><tbody>'+items.map(i=>'<tr><td>'+projectButton(i)+'</td><td>'+fmtDate(val(i,C.start))+'</td><td>'+fmtDate(val(i,C.plan))+(past(val(i,C.plan))&&active(i)?'<span class="pill red" style="margin-left:6px">Vencido</span>':'')+'</td><td>'+fmtDate(val(i,C.forecast))+'</td><td>'+closureLabel(i)+'</td><td>'+(i.subitems?.length||0)+'</td></tr>'+(i.subitems||[]).map(s=>'<tr style="background:#f8fafb"><td style="padding-left:28px"><strong>↳ '+esc(s.name)+'</strong><span class="id">Owner: '+esc(val(s,S.owner)||'Sin dato')+' · Team: '+esc(val(s,S.team)||'Sin dato')+'</span></td><td>'+fmtDate(val(s,S.start))+'</td><td>'+fmtDate(val(s,S.finish))+'</td><td colspan="2">Cronograma: '+esc(val(s,S.timeline)||'Sin dato')+'</td><td>'+esc(val(s,S.status)||'Sin dato')+'</td></tr>').join('')).join('')+'</tbody></table></div>'}
  function finMetric(label,id){const values=D.items.map(i=>num(i,id)).filter(x=>x!==null);const total=values.reduce((a,b)=>a+b,0);return'<article class="card pad"><div class="metric-label">'+esc(label)+'</div><div class="metric-value">'+(values.length?fmtNum(total):'Sin dato')+'</div><div class="metric-note">Suma literal · cobertura '+values.length+'/'+D.items.length+'</div></article>'}
  function renderFinanzas(){return head('Cobertura financiera','Finanzas y beneficios','Los campos históricos y los de control PMO permanecen separados para evitar mezclas de alcance.')+'<div class="warning"><strong>Moneda pendiente de confirmación.</strong> Las cifras se muestran como sumas literales del tablero y no deben tratarse como totales financieros oficiales hasta definir moneda y alcance.</div><h2 class="section-title">Campos operativos / legado</h2><section class="grid finance-grid" style="margin-top:12px">'+finMetric('CAPEX ejecutado',C.capexExec)+finMetric('CAPEX comprometido',C.capexCommit)+finMetric('OPEX',C.opex)+finMetric('Desviación presup. legado',C.budgetVarOld)+finMetric('CAPEX legado',C.capexOld)+'</section><h2 class="section-title" style="margin-top:26px">Control PMO y beneficios</h2><section class="grid finance-grid" style="margin-top:12px">'+finMetric('Presupuesto aprobado',C.budget)+finMetric('Costo proyectado',C.cost)+finMetric('Beneficios comprometidos',C.benefits)+finMetric('Beneficios logrados',C.benefitsDone)+'</section>'}
  function activityRows(){const ids=new Set(D.items.flatMap(i=>[i.id,...(i.subitems||[]).map(s=>s.id)]));return D.updates.filter(u=>(state.activityType==='linked')===ids.has(String(u.item_id))).filter(u=>!state.activitySearch||((u.text_body||'')+' '+(u.creator?.name||'')+' '+(u.item_id||'')).toLowerCase().includes(state.activitySearch.toLowerCase()))}
  function updateHtml(u){const item=D.items.find(i=>i.id===String(u.item_id));const title=item?.name||('Histórico · item '+(u.item_id||'sin ID'));return'<article class="update"><div class="rowtop"><div><strong>'+esc(title)+'</strong><div class="update-meta">'+esc(u.creator?.name||'Autor sin dato')+' · '+fmtDT(u.created_at)+' · update '+esc(u.id)+'</div></div>'+(!item?'<span class="pill amber">No vinculado</span>':'')+'</div><p>'+esc(u.text_body||'Actualización sin texto')+'</p>'+((u.assets||[]).length?pills((u.assets||[]).map(a=>['Archivo: '+(a.name||a.id),'blue'])):'')+((u.replies||[]).length?'<details><summary class="subtle" style="cursor:pointer">'+u.replies.length+' respuesta(s)</summary>'+u.replies.map(r=>'<div class="reply"><strong>'+esc(r.creator?.name||'Autor sin dato')+'</strong> · '+fmtDT(r.created_at)+'<br>'+esc(r.text_body||'Respuesta sin texto')+'</div>').join('')+'</details>':'')+'</article>'}
  function setActivity(type){state.activityType=type;state.activityShown=25;render()}
  function renderActividad(){const all=activityRows(),rows=all.slice(0,state.activityShown);return head('Trazabilidad','Actividad y documentos','Actualizaciones y respuestas ordenadas por fecha. Los registros de elementos eliminados se conservan como histórico no vinculado.')+'<div class="filters" style="grid-template-columns:minmax(220px,1fr) auto auto"><input class="control" placeholder="Buscar en actividad" value="'+esc(state.activitySearch)+'" onchange="state.activitySearch=this.value;state.activityShown=25;render()"><button class="control" onclick="setActivity(\'linked\')" style="font-weight:800;cursor:pointer;background:'+(state.activityType==='linked'?'#122a40;color:#fff':'#fff')+'">Vinculada</button><button class="control" onclick="setActivity(\'orphan\')" style="font-weight:800;cursor:pointer;background:'+(state.activityType==='orphan'?'#122a40;color:#fff':'#fff')+'">Histórico no vinculado</button></div><p class="section-note">Mostrando '+rows.length+' de '+all.length+' actualizaciones</p><section class="timeline">'+rows.map(updateHtml).join('')+'</section>'+(rows.length<all.length?'<button class="loadmore" onclick="state.activityShown+=25;render()">Cargar 25 más</button>':'')}
  function renderCalidad(){const act=D.items.filter(active),closed=D.items.filter(i=>val(i,C.status)==='Cerrado'),audited=closed.filter(i=>!val(i,C.real)&&closureInfo(i));const metrics=[['Cierres recuperados de bitácora',audited.length,closed.length,'Sin Fin Real; año obtenido del cambio a Cerrado en monday.'],['Cierres sin evidencia anual',closed.filter(i=>!closureInfo(i)).length,closed.length,'No existe Fin Real ni transición recuperada.'],['Cerrados con avance ≠ 100%',closed.filter(i=>num(i,C.progress)!==100).length,closed.length,'Se conserva el avance literal.'],['Activos sin Fin Plan',act.filter(i=>!val(i,C.plan)).length,act.length,'No se puede medir plazo.'],['Activos sin Inicio',act.filter(i=>!val(i,C.start)).length,act.length,'Cronograma incompleto.'],['Riesgo / bloqueo sin evaluar',act.filter(i=>!val(i,C.risk)||val(i,C.risk)==='Sin evaluar').length,act.length,'Impide clasificar la atención ejecutiva.'],['Fin Forecast ausente',D.items.filter(i=>!val(i,C.forecast)).length,D.items.length,'La desviación futura no es calculable.']];const flagged=D.items.filter(i=>flags(i).length);return head('Gobierno del dato','Calidad de datos','Cobertura, definiciones y excepciones del último corte disponible.')+'<section class="card pad" style="background:linear-gradient(110deg,#021e2f,#003d53);color:#fff;margin-bottom:18px"><div class="split-title"><div><span class="eyebrow">Corte validado</span><h2 style="margin:8px 0 4px">'+fmtDT(D.extracted_at_utc)+'</h2><span style="color:#cccfce">'+esc(D.board.name)+' · tablero '+esc(D.board.id)+'</span></div><span class="review-badge">'+D.inventory.projects+' proyectos · '+D.inventory.updates+' updates</span></div></section><section class="grid quality-grid">'+metrics.map(m=>'<article class="card quality-card"><strong>'+m[1]+'/'+m[2]+'</strong><span>'+esc(m[0])+'</span><div class="definition">'+esc(m[3])+'</div></article>').join('')+'</section><section class="card pad" style="margin-top:18px"><div class="split-title"><div><h2 class="section-title">Registros con banderas</h2><p class="section-note">'+flagged.length+' proyectos presentan al menos una excepción.</p></div></div><div class="list">'+flagged.map(i=>'<button class="rowbtn" onclick="openProject(\''+i.id+'\')"><div class="rowtop"><span><span class="rowtitle">'+esc(i.name)+'</span><span class="id">ID '+esc(i.id)+'</span></span>'+pills(flags(i))+'</div></button>').join('')+'</div></section>'}
  function render(){const main=document.getElementById('main');const renders={resumen:renderResumen,portafolio:renderPortafolio,atencion:renderAtencion,cronograma:renderCronograma,finanzas:renderFinanzas,actividad:renderActividad,calidad:renderCalidad};main.innerHTML=renders[state.view]();if(state.view==='portafolio')renderPortBody()}
  function fieldValue(i,c){if(c.id==='name')return i.name;if(c.id==='subtasks_mm03s00j')return (i.subitems?.length||0)+' subelemento(s)';const x=val(i,c.id);if(!x)return c.type==='formula'?'No calculable':'Sin dato';if(c.type==='date')return fmtDate(x);return x}
  function openProject(id){const i=D.items.find(x=>x.id===String(id));if(!i)return;const related=D.updates.filter(u=>String(u.item_id)===i.id||(i.subitems||[]).some(s=>s.id===String(u.item_id))).slice(0,20);const groups=[['Gobierno y clasificación',['color_mkzzg1vp','status','color_mkzwb5e3','multiple_person_mm087pe3','text_mm6b5rqp','color_mm6kys00','color_mm6kg2n5','color_mm6zdfgs']],['Cronograma y desempeño',['numeric_mkzrc075','numeric_mm6z45pc','formula_mm6zz4yh','date_mkzt74dd','date_mkzrb4nr','date_mm6zv2hs','date_mm6d8mx','formula_mm6z7hj2','numeric_mm6d2ctf','numeric_mm6dma87','formula_mm6dqzc2']],['Finanzas y beneficios',['numeric_mm6j1jmr','numeric_mm6jwj01','numeric_mm6j8yx','numeric_mm6jzmtq','numeric_mm6kwqt3','numeric_mm6zy5pb','numeric_mm6zpew3','formula_mm6dbyyn','numeric_mm6z864h','numeric_mm6z8734','formula_mm6dp6xa']],['Acción ejecutiva',['long_text_mm6zs5rc','multiple_person_mm6z7n01','date_mm6zeyj8','color_mm6zq06e','file_mm3amd88']],['Campos nativos',['name','subtasks_mm03s00j']]];const byId=Object.fromEntries(D.board.columns.map(c=>[c.id,c]));document.getElementById('dialog-content').innerHTML='<header class="dialog-head"><button class="close" onclick="document.getElementById(\'project-dialog\').close()" aria-label="Cerrar">×</button><div>'+statusPill(val(i,C.status))+pills(flags(i))+'</div><h2>'+esc(i.name)+'</h2><span>ID '+i.id+' · actualizado '+fmtDT(i.updated_at)+'</span></header><div class="dialog-body"><div class="grid kpis">'+metric('Avance',num(i,C.progress)===null?'Sin dato':num(i,C.progress)+'%','Valor literal de monday')+metric('Fin Plan',fmtDate(val(i,C.plan)),'Línea base aprobada')+metric('Fin Forecast',fmtDate(val(i,C.forecast)),'Estimación vigente')+metric('Cierre',closureLabel(i),closureSourceLabel(i))+'</div>'+groups.map(([name,ids])=>'<section class="fieldgroup"><h3>'+name+'</h3><dl class="fields">'+ids.map(id=>{const c=byId[id]||{id,title:id,type:''};const x=fieldValue(i,c);return'<div class="field"><dt>'+esc(c.title)+' · '+esc(c.id)+'</dt><dd>'+(id===C.gamma&&x!=='Sin dato'?'<a href="'+esc(x)+'" target="_blank" rel="noreferrer">Abrir documento ↗</a>':esc(x))+'</dd></div>'}).join('')+'</dl></section>').join('')+'<section class="fieldgroup"><div class="split-title"><h3>Subelementos</h3><span class="count">'+(i.subitems?.length||0)+'</span></div><div class="list">'+((i.subitems||[]).map(s=>'<div class="row"><strong>'+esc(s.name)+'</strong><div class="dates"><div class="datebox"><span>Owner</span><strong>'+esc(val(s,S.owner)||'Sin dato')+'</strong></div><div class="datebox"><span>Estado</span><strong>'+esc(val(s,S.status)||'Sin dato')+'</strong></div><div class="datebox"><span>Inicio Py</span><strong>'+fmtDate(val(s,S.start))+'</strong></div><div class="datebox"><span>Fin Py estimado</span><strong>'+fmtDate(val(s,S.finish))+'</strong></div></div></div>').join('')||'<div class="empty">Sin subelementos actuales</div>')+'</div></section><section class="fieldgroup"><div class="split-title"><h3>Actividad vinculada</h3><span class="count">'+related.length+'</span></div><div class="timeline">'+(related.map(updateHtml).join('')||'<div class="empty">Sin actividad vinculada</div>')+'</div></section><div class="footer"><a href="'+esc(i.url)+'" target="_blank" rel="noreferrer"><strong>Abrir elemento original en monday ↗</strong></a></div></div>';document.getElementById('project-dialog').showModal()}
  document.getElementById('cut-label').textContent='Corte '+fmtDT(D.extracted_at_utc);
  document.getElementById('board-link').href=D.board.url;
  document.getElementById('scope').textContent=D.inventory.projects+' proyectos · '+D.inventory.subitems+' subelementos · '+D.inventory.columns+' columnas · '+D.inventory.updates+' actualizaciones · '+D.inventory.replies+' respuestas · '+D.inventory.assetsUnique+' archivos únicos.';
  document.getElementById('project-dialog').addEventListener('click',e=>{if(e.target.id==='project-dialog')e.target.close()});
  nav();render();
  </script>
  <script id="apple-design-interactions">
    function toggleFullscreen() {
      const root = document.documentElement;
      if (!document.fullscreenElement && root.requestFullscreen) {
        root.requestFullscreen().catch(() => {});
      } else if (document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    }
    document.addEventListener('fullscreenchange', () => {
      const button = document.getElementById('fullscreen-button');
      if (button) button.textContent = document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa';
    });
  </script>
