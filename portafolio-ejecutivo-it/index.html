  <style id="apple-design-v1">
    :root {
      --ease-fluid: cubic-bezier(.22, 1, .36, 1);
      --press-scale: .985;
      --glass: rgba(255, 255, 255, .82);
      --glass-strong: rgba(255, 255, 255, .94);
      --hairline: rgba(17, 43, 64, .10);
      --focus-ring: rgba(69, 126, 160, .34);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      font-optical-sizing: auto;
    }

    html, body { min-height: 100%; }
    body {
      background:
        radial-gradient(circle at 86% -10%, rgba(203, 167, 133, .17), transparent 30rem),
        linear-gradient(180deg, #f8fafb 0%, #f2f5f7 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .topbar {
      top: 0;
      background: rgba(10, 29, 45, .86);
      border-bottom: 1px solid rgba(255, 255, 255, .14);
      box-shadow: 0 10px 34px -24px rgba(3, 12, 20, .92);
      backdrop-filter: blur(24px) saturate(165%);
      -webkit-backdrop-filter: blur(24px) saturate(165%);
    }
    .topbar::after {
      content: "";
      position: absolute;
      inset: auto 0 -12px;
      height: 12px;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(11, 27, 43, .09), transparent);
    }
    .topinner {
      width: 100%;
      max-width: none;
      height: 72px;
      padding: 0 clamp(16px, 2.2vw, 36px);
      gap: 16px;
    }
    .logo {
      background: rgba(255, 255, 255, .05);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10);
    }
    .review-badge, .board-link {
      background: rgba(255, 255, 255, .08);
      border-color: rgba(255, 255, 255, .18);
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
    }
    .board-link {
      min-height: 40px;
      color: #fff;
      cursor: pointer;
      transition: transform 180ms var(--ease-fluid), background-color 180ms ease, border-color 180ms ease;
    }
    .board-link:hover { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .3); }
    .board-link:active { transform: scale(var(--press-scale)); transition-duration: 80ms; }
    .fullscreen-btn { border-style: solid; }

    .shell {
      width: 100%;
      max-width: none;
      min-height: calc(100vh - 72px);
      margin: 0;
      grid-template-columns: 264px minmax(0, 1fr);
    }
    .sidebar {
      top: 72px;
      height: calc(100vh - 72px);
      padding: 18px 14px;
      background: rgba(248, 250, 251, .78);
      border-right-color: var(--hairline);
      backdrop-filter: blur(24px) saturate(145%);
      -webkit-backdrop-filter: blur(24px) saturate(145%);
    }
    .nav button {
      position: relative;
      overflow: hidden;
      min-height: 46px;
      border-radius: 13px;
      transition: transform 190ms var(--ease-fluid), background-color 190ms ease, color 190ms ease, box-shadow 190ms ease;
    }
    .nav button:hover { transform: translateX(2px); background: rgba(224, 232, 238, .78); }
    .nav button:active { transform: translateX(2px) scale(var(--press-scale)); transition-duration: 80ms; }
    .nav button.active {
      background: linear-gradient(135deg, rgba(18, 42, 64, .98), rgba(28, 61, 87, .98));
      box-shadow: 0 14px 28px -19px rgba(11, 31, 48, .9), inset 0 1px 0 rgba(255, 255, 255, .12);
    }
    .scope {
      background: rgba(255, 255, 255, .64);
      border-color: var(--hairline);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .main { padding: clamp(26px, 3vw, 48px) clamp(18px, 3.4vw, 58px) 64px; }
    .heading h1 {
      font-size: clamp(30px, 3vw, 44px);
      line-height: 1.04;
      letter-spacing: -.038em;
      text-wrap: balance;
    }
    .heading p { font-size: 14px; line-height: 1.58; }

    .card, .rowbtn, .row, .tablewrap, .control, .datebox, .update, .warning {
      border-color: var(--hairline);
    }
    .card, .tablewrap, .rowbtn, .row, .update {
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      box-shadow: 0 18px 48px -34px rgba(15, 42, 62, .55), inset 0 1px 0 rgba(255, 255, 255, .72);
    }
    .card { border-radius: 18px; }
    .card.pad { padding: clamp(18px, 2vw, 24px); }
    .metric-value { font-size: clamp(30px, 2.6vw, 38px); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
    .rowbtn {
      transition: transform 190ms var(--ease-fluid), background-color 190ms ease, border-color 190ms ease, box-shadow 190ms ease;
    }
    .rowbtn:hover {
      transform: translateY(-2px);
      background: var(--glass-strong);
      border-color: rgba(49, 93, 121, .24);
      box-shadow: 0 20px 48px -32px rgba(15, 42, 62, .72), inset 0 1px 0 #fff;
    }
    .rowbtn:active { transform: translateY(0) scale(.992); transition-duration: 80ms; }
    .project-link, .loadmore, .close, .control { transition: transform 170ms var(--ease-fluid), border-color 170ms ease, background-color 170ms ease, box-shadow 170ms ease; }
    .project-link:active, .loadmore:active, .close:active { transform: scale(.97); transition-duration: 80ms; }
    .control { background: rgba(255, 255, 255, .88); border-radius: 12px; }
    .control:focus { border-color: #4d7b95; box-shadow: 0 0 0 4px var(--focus-ring); }
    .table tbody tr { transition: background-color 150ms ease; }
    .table tbody tr:hover { background: rgba(230, 238, 243, .52); }
    .track, .progress { box-shadow: inset 0 1px 2px rgba(23, 51, 71, .10); }
    .fill, .progress i { transition: width 420ms var(--ease-fluid); }

    .dialog {
      border-radius: 22px;
      background: rgba(248, 250, 251, .95);
      box-shadow: 0 36px 100px rgba(3, 14, 23, .42);
      transform-origin: 50% 12%;
    }
    .dialog[open] { animation: materialize 280ms var(--ease-fluid); }
    .dialog::backdrop { background: rgba(5, 14, 23, .5); backdrop-filter: blur(8px) saturate(115%); }
    .dialog-head {
      background: rgba(10, 29, 45, .92);
      backdrop-filter: blur(24px) saturate(155%);
      -webkit-backdrop-filter: blur(24px) saturate(155%);
    }
    @keyframes materialize {
      from { opacity: 0; transform: translateY(10px) scale(.985); filter: blur(3px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    :where(button, a, input, select, summary):focus-visible {
      outline: 3px solid rgba(100, 163, 200, .66);
      outline-offset: 3px;
    }

    @media (max-width: 800px) {
      .topinner { padding: 10px 14px; gap: 10px; }
      .topmeta { margin-left: auto; }
      .topmeta strong { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .fullscreen-btn { display: none; }
      .shell { min-height: calc(100vh - 72px); }
      .sidebar {
        top: 0;
        height: auto;
        padding: 8px 10px;
        background: rgba(248, 250, 251, .9);
        backdrop-filter: blur(20px) saturate(150%);
        -webkit-backdrop-filter: blur(20px) saturate(150%);
      }
      .nav button { min-height: 42px; border-radius: 12px; }
      .nav button:hover { transform: none; }
      .main { padding: 24px 14px 44px; }
      .heading h1 { font-size: clamp(28px, 9vw, 38px); }
      .card { border-radius: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .topbar, .sidebar, .card, .rowbtn, .row, .tablewrap, .update, .dialog-head { backdrop-filter: none; -webkit-backdrop-filter: none; }
      .topbar, .dialog-head { background: #10283c; }
      .sidebar, .card, .rowbtn, .row, .tablewrap, .update { background: #fff; }
    }
    @media (prefers-contrast: more) {
      :root { --hairline: rgba(17, 43, 64, .34); }
      .card, .rowbtn, .row, .tablewrap, .control, .datebox, .update { background: #fff; box-shadow: none; }
    }
  </style>

alue":null,"display_value":""}]}],"updates":[{"id":"5577758326","text_body":"24/09: Se constató que las observaciones enviadas continúan sin ser atendidas por el proveedor, a pesar de que este afirmó que ya habían sido resueltas.\n\nEl proveedor de equipos móviles envió su cotización y se remitieron a Expandia las características del móvil propuesto para que nos confirme si es óptimo para el uso de la aplicación.","created_at":"2026-09-24T21:43:58.000Z","updated_at":"2026-09-24T21:43:58.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12773879426","replies":[],"assets":[]},{"id":"5577753658","text_body":"24/09: Se realizó con éxito la eliminación del prefijo ID.\n\nEn pruebas UAT se encontraron nuevas observaciones que han sido remitidas al proveedor. Se continua con las pruebas con usuarios.","created_at":"2026-09-24T21:41:39.000Z","updated_at":"2026-09-24T21:41:39.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12002357229","replies":[],"assets":[]},{"id":"5573952871","text_body":"23/09: Se requiere eliminación de prefijo ID en BS, requerimiento enviado a Franklin para que de soporte en la eliminación. Fecha prevista de levantamiento de observación 25/09.\n\n\n\n","created_at":"2026-09-23T21:58:20.000Z","updated_at":"2026-09-23T21:58:20.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12002357229","replies":[],"assets":[]},{"id":"5566491791","text_body":"21/09: Franklin finalizo el desarrollo del Api de embarcaciones y se realizó el pase a producción el 21/09. Asimismo, se comunico de este pase a Francisco para que realice las actualizaciones respectivas.\n\n\n\nPor otro lado, continuamos a la espera del levantamiento de observaciones enviadas a Francisco el 18/09.","created_at":"2026-09-21T22:14:13.000Z","updated_at":"2026-09-21T22:15:12.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12773879426","replies":[],"assets":[]},{"id":"5566487547","text_body":"21//09: Se realizaron pruebas UAT y se hallaron errores que fueron enviados al proveedor. Se planifica finalizar las pruebas el 23/09.","created_at":"2026-09-21T22:11:49.000Z","updated_at":"2026-09-21T22:11:49.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12002357229","replies":[],"assets":[]},{"id":"5562900810","text_body":"Estado al 20/09: contrato CT0150 en revisión final, pendiente de firma.\n\nEl viernes 18/09 por la tarde se remitieron a Expandia las observaciones consolidadas de Legal y de Gerencia TI: propiedad de COSMOS sobre código, repositorios y documentación; SLA exigibles y no referenciales; penalidad máxima 10%; pago máximo 60% antes del despliegue; garantía mínima de 120 días; retención o carta fianza del 10%; disponibilidad de 99.5% con RTO de 4 horas y RPO de 1 hora; matriz de interfaces con criterios de aceptación; seguridad y tratamiento de datos biométricos; y criterios mínimos de aceptación y Go-Live.\n\nExpandia confirmó recepción el mismo 18/09 y se comprometió a entregar la versión ajustada el 21/09. Aún no ha sido recibida.\n\nSiguiente paso: validar la versión de Expandia contra la matriz de observaciones y elevar a firma. La fecha Fin Plan (30/10/2026) se revisará una vez definida la fecha de firma.","created_at":"2026-09-20T22:38:16.000Z","updated_at":"2026-09-20T22:38:16.000Z","creator":{"id":"99092612","name":"Alonso Pena"},"item_id":"11062536522","replies":[],"assets":[]},{"id":"5557814893","text_body":"17/09: Se tuvo segunda reunión de capacitación de uso de la plataforma de check in por parte de Seidor dirigido a los usuarios de Paita. Los usuarios se comprometieron a entregar las evidencias de pruebas UAT para el 18/09.\n\n\n\nAsimismo, por el lado de proyectos, se revisó las funcionalidades de la plataforma y se hallaron observaciones que se remitieron a Seidor para su pronta solución.","created_at":"2026-09-17T20:56:20.000Z","updated_at":"2026-09-17T20:56:20.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12773879426","replies":[],"assets":[]},{"id":"5553405649","text_body":"16/09: Se programó corte de información para pase a QA el 16/09 en la noche y se realizará la configuración general de esta el 17/09.\n\n\n\nSe iniciaran pruebas UAT con el equipo de Cosmos el 18/09.","created_at":"2026-09-16T17:21:33.000Z","updated_at":"2026-09-16T17:21:33.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12002357229","replies":[],"assets":[]},{"id":"5553397766","text_body":"16/09: Se contacto al proveedor DMS Perú para que nos brinde información sobre sus equipos disponibles. Se programó la reunión de consultas para el 16/09. Se realizará la evaluación de estos teniendo en cuenta las características que Expandía solicitó para la aplicación.\n\n\n\nCaracterísticas solicitadas:\n\n - Sistema operativo: Android 14 como mínimo.\n\n- Tecnología: Compatible con Angular + Ionic/Capacitor.\n- Reconocimiento facial: SDK específico para reconocimiento facial.\n- Cámara: Mínimo de 12 MP.\n- Biometría: Lector ZKTeco SLK20R con conexión USB-C.","created_at":"2026-09-16T17:19:27.000Z","updated_at":"2026-09-16T17:19:27.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12773879426","replies":[],"assets":[]},{"id":"5553376245","text_body":"16/09: Se planificaron pruebas UAT con los usuarios de Paitaa. Deberán entregar sus evidencias de las pruebas realizadas antes del 17/09. Con base en las observaciones encontradas, se realizará una reunión con el proveedor el 18/09 para el levantamiento de dichas observaciones.","created_at":"2026-09-16T17:13:16.000Z","updated_at":"2026-09-16T17:13:16.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12773879426","replies":[],"assets":[]},{"id":"5553367701","text_body":"15/09: Se realizó una reunión con Luis Gatica y G\u0026S para conocer en detalle las características de seguridad de Azure. Se acordó que G\u0026S enviaría una propuesta de mejora en la seguridad de Azure y, con base en esta propuesta, se evaluará junto con Luis Gatica la mejor opción para llevar a cabo la migración a Azure.","created_at":"2026-09-16T17:10:52.000Z","updated_at":"2026-09-16T17:10:52.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12773879426","replies":[],"assets":[]},{"id":"5545259579","text_body":"Kickoff del proyecto 14/09.\n\nPendiente aprobación del 50% de la OC por el esfuerzo de implementación de las integraciones.","created_at":"2026-09-14T14:56:47.000Z","updated_at":"2026-09-14T14:56:47.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"12243759594","replies":[],"assets":[]},{"id":"5521129130","text_body":"El equipo de facturación marítima gestiona actualmente pagos al contado que son solicitados por correo. Con el objetivo de estandarizar este proceso, agradeceré que me comenten qué se requiere para poder gestionarlos a través del portal de pagos actual.\n\nPara avanzar con esto, solicito el siguiente apoyo:\n\n- Equipo de TI: Un encargado para validar los requerimientos técnicos del portal actual.\n- Equipo de Tesorería: Su apoyo para validar en conjunto que este flujo se alinee con el estándar de las atenciones al contado de las otras unidades de negocio.\n\nQuedo atento a sus comentarios para coordinar los siguientes pasos, estos son los servicios actuales que gestiona mi equipo.\n\nENTIDAD\nSERVICIO\n\nAutoridad Portuaria Nacional (APN)\nRecepción y despacho de naves\n\nSanidad Marítima\nRecepción y despacho de las naves\n\nMarina de Guerra del Perú - Direccin DICAPI\nDerecho de Ayudas a la Navegación\n\nAPM terminals Callao\nDerechos de Uso de Muelle , Uso de lanchas, etc\n\nTerminal Portuario Paracas\nUso de Muelle\n\nTransmarina del Perú\nDesembarque/Embarque de Tripulantes\n\nIturri Agente Portuario SAC\nSub agenciamos para la atención de naves en el puerto de ETEN","created_at":"2026-09-04T16:19:39.000Z","updated_at":"2026-09-04T16:19:39.000Z","creator":{"id":"98321015","name":"Milagros Cheel"},"item_id":"12978628465","replies":[],"assets":[]},{"id":"5521126598","text_body":"Portal de Compras (u otro canal adecuado) pueda recibir e integrar las solicitudes de pago que actualmente nos llegan solo por correo electrónico, con el objetivo de asegurar la trazabilidad de cada caso y que las mismas tengan las aprobaciones correspondientes de cada gerencia.\n\nN°\nTipo de Pagos solicitados por correo\n\n1\nPagos Electrónicos SUNAT como Agente de Aduanas (Derechos, Percepción, Multas, etc.)\n\n2\nPagos de Devoluciones de Clientes (cobranzas)\n\n3\nSolicitud de Cheques de gerencia (ret. Judiciales, dudas razonables, etc.)\n\n4\nPagos de Ayudas a la Navegación\n\n5\nPagos Electrónicos SUNAT como OCE/Interviniente (Recepción,Zarpe,Sanidad Recepción, etc.)\n\n6\nPagos de Sanidad Despacho\n\n7\nPagos de Solicitudes de Fondo (anticipos, a rendir, viáticos,etc.)\n\n8\nPagos de Cajas chicas\n\n9\nPagos de Reembolsos de gastos\n\n10\nPagos de SENASA\n\nSaludos","created_at":"2026-09-04T16:19:08.000Z","updated_at":"2026-09-04T16:19:08.000Z","creator":{"id":"98321015","name":"Milagros Cheel"},"item_id":"12978622972","replies":[],"assets":[]},{"id":"5507054023","text_body":"Se envió las observaciones al contrato en coordinación con el área legal. El proveedor se encuentra igualmente revisando las observaciones del contrato, igualmente pendiente el gantt a la fecha","created_at":"2026-08-31T19:20:16.000Z","updated_at":"2026-08-31T19:20:16.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"12243759594","replies":[],"assets":[]},{"id":"5507046055","text_body":"Se envió un recordatorio al cliente.\n\nMis mayor actividad a la fecha","created_at":"2026-08-31T19:18:27.000Z","updated_at":"2026-08-31T19:18:27.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"11061239961","replies":[],"assets":[]},{"id":"5495274955","text_body":"Ultima actualización de la propuesta de integraciones que no incluye la integración de SINTAD con el TMS (exceptuado por el proveedor) Se estima por esta implementación 1k adicional\n\n","created_at":"2026-08-26T22:39:17.000Z","updated_at":"2026-08-26T22:41:48.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"12243759594","replies":[],"assets":[{"id":"3206894707","name":"image.png","url":"https://cosmos-digital-transformation.monday.com/protected_static/33168202/resources/3206894707/image.png","file_extension":".png","file_size":294858,"created_at":"2026-08-26T22:39:07Z"}]},{"id":"5494276851","text_body":"@Juan Pablo Arbulú  detallar en las columnas capex/opex","created_at":"2026-08-26T18:18:27.000Z","updated_at":"2026-08-26T18:18:27.000Z","creator":{"id":"97963666","name":"Pierre Lozano"},"item_id":"11941507121","replies":[],"assets":[]},{"id":"5494275554","text_body":"@Alonso Pena  detallar en las columnas capex/opex","created_at":"2026-08-26T18:18:06.000Z","updated_at":"2026-08-26T18:18:06.000Z","creator":{"id":"97963666","name":"Pierre Lozano"},"item_id":"11820220046","replies":[],"assets":[]},{"id":"5494274303","text_body":"@Valeria Hermoza detallar en las columnas capex/opex","created_at":"2026-08-26T18:17:48.000Z","updated_at":"2026-08-26T18:17:48.000Z","creator":{"id":"97963666","name":"Pierre Lozano"},"item_id":"12002357229","replies":[],"assets":[]},{"id":"5485955067","text_body":"Se envio a aprobación el documento de especificación a las gerencias involucradas, teniendo respuestas de las gerencia de Transportes y Aduanas, (falta respuesta de GAF)\n\n","created_at":"2026-08-24T14:30:35.000Z","updated_at":"2026-08-24T14:30:35.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"12243759594","replies":[],"assets":[]},{"id":"5485930085","text_body":"Se sostuvo reunión el miércoles 19/08 con el cliente HUAWEI quien manifiesta no tener disponibles los datos solicitados por el sistema, pero creen que pueden incluirla y nos responderian esta semana para avanzar con la integración de sus ordenes","created_at":"2026-08-24T14:24:58.000Z","updated_at":"2026-08-24T14:24:58.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"11061239961","replies":[],"assets":[]},{"id":"5479231629","text_body":"20/08: Se realizó una sesión de trabajo con Johnny para la revisión y estructuración del proceso. Se identificaron actividades, puntos pendientes y oportunidades de mejora.","created_at":"2026-08-20T22:33:41.000Z","updated_at":"2026-08-20T22:33:41.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"11942011799","replies":[],"assets":[]},{"id":"5468639017","text_body":"Se colocó en Stand by por dar prioridad al proceso de compras.","created_at":"2026-08-18T05:31:06.000Z","updated_at":"2026-08-18T05:31:06.000Z","creator":{"id":"105272946","name":"Johnny Abarca"},"item_id":"12556214243","replies":[],"assets":[]},{"id":"5468495008","text_body":"Se avanzó con lo siguiente:\n1. Definición del macroproceso:\n 1.1. Rendición de gastos\n 1.3. Asignación de caja chica\n\nSe cuenta con el diagrama de proceso de Rendición de gastos y solicitud de fondos que faltan validar con los usuario. Se indicó que el 18/08 se revisará el flujo.\n","created_at":"2026-08-18T02:52:25.000Z","updated_at":"2026-08-18T02:52:25.000Z","creator":{"id":"105272946","name":"Johnny Abarca"},"item_id":"11043427692","replies":[],"assets":[]},{"id":"5468244245","text_body":"Se realizaron los siguientes cambios:\n\n1. Cotización de clientes\nSe validó con Renzo el flujo de cotización y falta validar lo de Aduana con Deckner Campusano. Se ha confirmado la reunión para el 19/08.\n\n2. Creación de código de servicio\nSe validó la información con Renzo el flujo de proceso de creación de código del servicio el día viernes 14/08. Se está coordinando para el viernes 21/08 una reunión con el equipo de Finanzas y contabilidad para revisar parte del flujo de automatización de cuentas contable.\n\n3. Liquidación del servicio\nSe mantuvo una reunión con facturación Jenny e Italo para ver el flujo. Falta levantar la parte de la operación maritima - Falta validar\n\n4. Integración con sistemas terceros\nSe está incluyendo el proceso con la integración con sistemas terceros asociado al sub proceso de trazabilidad - Falta validar\n\n5. Trazabilidad del servicio\nEl flujo pendiente de crear.","created_at":"2026-08-17T23:19:44.000Z","updated_at":"2026-08-17T23:19:44.000Z","creator":{"id":"105272946","name":"Johnny Abarca"},"item_id":"11043402746","replies":[],"assets":[]},{"id":"5468133699","text_body":"Recién se visualiza como tarea para procesos.\nSe requiere reunión para definir del alcance con equipo PM @Pierre Lozano.","created_at":"2026-08-17T22:34:49.000Z","updated_at":"2026-08-17T22:34:49.000Z","creator":{"id":"105272946","name":"Johnny Abarca"},"item_id":"12063932150","replies":[],"assets":[]},{"id":"5468062707","text_body":"Recién se visualiza como tarea para procesos.\nSe requiere reunión para definir del alcance con equipo PM @Pierre Lozano.\n","created_at":"2026-08-17T22:07:13.000Z","updated_at":"2026-08-17T22:07:13.000Z","creator":{"id":"105272946","name":"Johnny Abarca"},"item_id":"11041978965","replies":[],"assets":[]},{"id":"5467997557","text_body":"Se realizó el levantamiento del proceso a Lady Talledo (Jefa de Compras)\nSe está cambiando 02 procesos dentro del flujo (Transferencia entre almacén e Inventario) que se presentará el día 18/08.\nSe espera presentar el flujo el jueves 20/08 a @Milagros Cheel y @Pierre Lozano para su validación antes de la presentación con Giancarlo Cabello","created_at":"2026-08-17T21:41:22.000Z","updated_at":"2026-08-17T21:41:22.000Z","creator":{"id":"105272946","name":"Johnny Abarca"},"item_id":"11062401044","replies":[],"assets":[]},{"id":"5467982156","text_body":"1. Onboarding de cliente:\nSe realizó la presentación a Giancarlo Cabello el 12/08, durante la presentación se sugirió algunos cambios que ya se realizaron. Solo falta la firma de aprobación.\n\n2. Alta de proveedores:\nSe adjunta en el proceso el diagrama de flujo realizado.\nPor confirmar reunión (Giancarlo Cabello) para el 21/08.\nPor confirmar fecha de revisión con @Milagros Cheel y @Pierre Lozano\n\n3. Creación de código de servicio:\nSe adjunta en el proceso el diagrama de flujo realizado.\nSe revisó el proceso con Renzo Larrauri y Johnny Saldaña.\nPor confirmar fecha de revisión con @Milagros Cheel y @Pierre Lozano ","created_at":"2026-08-17T21:37:08.000Z","updated_at":"2026-08-17T21:37:08.000Z","creator":{"id":"105272946","name":"Johnny Abarca"},"item_id":"11942011799","replies":[],"assets":[]},{"id":"5467045757","text_body":"17/08: Se acordó con Raúl realizar reuniones de seguimiento todos los viernes para revisar el avance y las actualizaciones del proyecto.","created_at":"2026-08-17T17:43:38.000Z","updated_at":"2026-08-17T17:43:38.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12002357229","replies":[],"assets":[]},{"id":"5461653984","text_body":"Queda pendiente para revisión interna el ticket de defecto https://cosmos-digital-transformation.monday.com/item/D-521","created_at":"2026-08-14T16:29:32.000Z","updated_at":"2026-08-14T16:29:43.000Z","creator":{"id":"99092612","name":"Alonso Pena"},"item_id":"11041978965","replies":[{"id":"5461654485","text_body":"@Juan Pablo Arbulú @Pierre Lozano ","created_at":"2026-08-14T16:29:43.000Z","updated_at":"2026-08-14T16:29:43.000Z","creator":{"id":"99092612","name":"Alonso Pena"}}],"assets":[]},{"id":"5461433671","text_body":"Comentarios: 14/08/2026\n1.- Falta actualizar el proceso de como es el flujo cuando el proveedor seleccionará trabajos/servicios realizados por RxH\n\n@Johnny Abarca\n\n2.- OC 142906 pendiente de aprobar por las mejoras adicionales por USD 2800.00, el proveedor SmartCode insiste que los trabajos son con el 50% de adelante pero en esta ocasión basta con el envío de la OC. Es importante se realice ello.\n\n3.- En configuración el storage account para administrar los documentos cargador en el portal desde nuestra suscripción en Azure.","created_at":"2026-08-14T15:37:09.000Z","updated_at":"2026-08-14T15:40:02.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"11041988731","replies":[],"assets":[]},{"id":"5454702627","text_body":"Buenos días @Johnny Abarca ya contamos en el proceso 100% levantado?","created_at":"2026-08-12T16:54:00.000Z","updated_at":"2026-08-12T16:54:00.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"11942011799","replies":[],"assets":[]},{"id":"5454118198","text_body":"El 11/08 Raúl envío el cronograma en el cual indica que iniciará el desarrollo el 17/08 y propone salir en vivo el 23/09.","created_at":"2026-08-12T14:35:14.000Z","updated_at":"2026-08-12T14:35:14.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12002357229","replies":[],"assets":[]},{"id":"5452047726","text_body":"Se tuvo reunión para revisar alcance de los tickets entre Baufest y Cosmos\n\n\nTemas tratados\n\n* D-501 – Avisos de visibilidad de llegada: Se revisaron las diferencias entre el aviso descargado y el enviado por correo, el logo faltante en la descarga y las cláusulas que deben mostrarse según la línea naviera.\nhttps://cosmos-digital-transformation.monday.com/item/D-501\n\n* D-501 – Configuración de direccionamientos: Se requiere que los direccionamientos y depósitos por defecto sean configurables según la línea naviera y sucursal.\nhttps://cosmos-digital-transformation.monday.com/item/D-501\n\n* D-501 – Links de direccionamiento y registro de desglose: Los enlaces deben apuntar a Cosmos Connect y no a la plataforma anterior.\nhttps://cosmos-digital-transformation.monday.com/item/D-501\n\n* D-501 – Correo de atención al cliente: El correo mostrado en los avisos debe obtenerse según la configuración del puerto o sucursal de operación.\nhttps://cosmos-digital-transformation.monday.com/item/D-501\n\n* D-522 – Homogenización de campos: Aplicar trim al inicio y final de los campos de texto libre antes de validar, guardar y transmitir la información.\nhttps://cosmos-digital-transformation.monday.com/item/D-522\n\n* D-521 – Autenticación en External Connect: Se identificó que algunos usuarios ingresan sin código de verificación. El caso requiere revisión con Infraestructura/Azure para asegurar un comportamiento uniforme.\nhttps://cosmos-digital-transformation.monday.com/item/D-521\n\n* D-515 – Creación masiva de equipos: Se requiere revisar la carga masiva de equipos, debido a registros creados sin información de “dueño de equipo”.\nhttps://cosmos-digital-transformation.monday.com/item/D-515\n\n* Doble envío de manifiesto, pago ASBANC y daños en contenedores: Se mantienen como temas pendientes de validación. No se les asigna ticket en esta sección porque no se identificó un movimiento realizado hoy hacia “Requiere definición de Cosmos”.","created_at":"2026-08-11T20:12:12.000Z","updated_at":"2026-08-11T20:12:12.000Z","creator":{"id":"99092612","name":"Alonso Pena"},"item_id":"11041978965","replies":[],"assets":[]},{"id":"5450771616","text_body":"Sistema debe incluir una validación de cierre de operaciones de aduanas o cualquier unidad de negocio y que gatille la siguiente actividad","created_at":"2026-08-11T15:44:36.000Z","updated_at":"2026-08-11T15:44:36.000Z","creator":{"id":"98321015","name":"Milagros Cheel"},"item_id":"11043402746","replies":[],"assets":[]},{"id":"5450697704","text_body":"Se adjunta logotipo e isotipo Cosmos Logotipo e Isotipo.rar","created_at":"2026-08-11T15:34:03.000Z","updated_at":"2026-08-11T15:34:03.000Z","creator":{"id":"99092612","name":"Alonso Pena"},"item_id":"12773879426","replies":[],"assets":[{"id":"3171792901","name":"Logotipo e Isotipo.rar","url":"https://cosmos-digital-transformation.monday.com/protected_static/33168202/resources/3171792901/Logotipo%20e%20Isotipo.rar","file_extension":".rar","file_size":77120,"created_at":"2026-08-11T15:25:19Z"}]},{"id":"5450644519","text_body":"Categorizar Clientes","created_at":"2026-08-11T15:22:55.000Z","updated_at":"2026-08-11T15:22:55.000Z","creator":{"id":"98321015","name":"Milag eator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"11062401044","replies":[],"assets":[]},{"id":"5435205086","text_body":"Se aprobó la propuesta por $ 2800.00, el recurrente será asumido por Cosmos con la implementación de un storage en la nube que será consumido por la aplicación.\n\nEl proceso aún no se encuentra finalizado porque no se ha entregado el documento con el comportamiento cuando se registre RxH.","created_at":"2026-08-05T16:22:29.000Z","updated_at":"2026-08-05T16:22:29.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"11041988731","replies":[],"assets":[]},{"id":"5431197950","text_body":"Buen día @Juan Pablo Arbulú,\n\nRaúl te compartió el cronograma de actividades?","created_at":"2026-08-04T15:47:51.000Z","updated_at":"2026-08-11T14:45:12.000Z","creator":{"id":"112495006","name":"Valeria Hermoza"},"item_id":"12002357229","replies":[{"id":"5431207194","text_body":"Hola @Valeria Hermoza , aún no.\nHace unos minutos le envié un recordatorio.\nVoy a volver a enviar el correo y te agregaré para que puedas estar en la línea del correo.","created_at":"2026-08-04T15:49:19.000Z","updated_at":"2026-08-04T15:49:19.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"}},{"id":"5450458182","text_body":"cómo va esto?","created_at":"2026-08-11T14:45:12.000Z","updated_at":"2026-08-11T14:45:12.000Z","creator":{"id":"97963666","name":"Pierre Lozano"}}],"assets":[]},{"id":"5422628616","text_body":"Hoy 31/07 ya se tuvo la aprobación final por parte de Cristina.\nEl día lunes 03/08, Raúl Manturrano compartirá el cronograma de actividades.","created_at":"2026-07-31T17:55:00.000Z","updated_at":"2026-07-31T17:55:00.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"12002357229","replies":[],"assets":[]},{"id":"5422416050","text_body":"Sin actividades al respecto en esta semana.","created_at":"2026-07-31T17:01:29.000Z","updated_at":"2026-07-31T17:01:29.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"11061239961","replies":[],"assets":[]},{"id":"5422414498","text_body":"Convendría por estrategia abordar el alcance únicamente para solicitudes de fondos y rendiciones de gastos de temas administrativos. Dejando la parte operativa para el inmediato siguiente momento (Mismo que se viene aun relevando por el equipo de procesos)\n\nSe precisó al equipo de procesos que el proyecto de \"Migración del TMS\" tiene cierto alcance al respecto lo que actualmente es denominado 'caja chica' y es gestionado actualmente por Sicer.\n\nHoy deben enviar el proceso de Caja chica de gastos de transporte para validar su alcance con el proyecto de \"Migración del TMS\".\n\n\n\n","created_at":"2026-07-31T17:00:58.000Z","updated_at":"2026-07-31T17:00:58.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"11043427692","replies":[],"assets":[]},{"id":"5422320901","text_body":"Se concluyo con las validaciones de integración con el proveedor, con la cual el proveedor tiene claro el alcance al respecto y actualizará su propuesta al respecto al esfuerzo de las integraciones. Gamma Actualizado\n\nMe encuentro actualizando las especificaciones para enviarlas al proveedor.","created_at":"2026-07-31T16:31:08.000Z","updated_at":"2026-07-31T16:31:08.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"12243759594","replies":[],"assets":[]},{"id":"5421888667","text_body":"El proveedor SmartCode envía la propuesta con los nuevos requerimientos\n$ 2800.00 el control de cambio.\n$ 120.00 recurrente por que se ampliará el almacenamiento de documentos.\n\nLas funcionalidades incluidas son:\n\n1.- Pantalla de documentos relacionados a la OC –\no El usuario podrá colocar el nro. de OC y el portal mostrará todos los documentos\nrelacionados a la misma para visualización y descarga.\n2.- Módulo de aprobación de actas de conformidad según el flujo siguiente:\n3.- Generación de pdf con firmas guardadas De la aceptación.\n4.- Validación si se carga FT o RxH (pendiente por enviar el proceso de RxH por procesos)\n\nEl tiempo de implementación sería 29/08 pero es importante cuanto antes su aprobación.\n\nAún no se agrega en el cuadro del monday porque estamos a la espera de la aprobación para registrarlo.","created_at":"2026-07-31T14:55:55.000Z","updated_at":"2026-07-31T14:55:55.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"11041988731","replies":[],"assets":[]},{"id":"5408200848","text_body":"@Pierre Lozano ,\nSe tuvo la reunión de entendimiento con el proveedor SmartCode y de manera general es viable.\nRequiere que le puedan compartir el alcance funcional a fin que pueda revisar a detalle de manera técnica los procesos, reportes involucrados y pueda darnos una propuesta adecuada.","created_at":"2026-07-27T20:38:02.000Z","updated_at":"2026-07-27T20:38:02.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"12063932150","replies":[],"assets":[]},{"id":"5407406728","text_body":"Se tuvo la reunión el día 24/07, según lo acordado, el sistema no validaría lo que hay dentro del documento, pero en la sesión Cristina indicó que lo que había entendido es que el sistema realizaría todas las validaciones incluyendo el contenido.\n\nEs por ello, que se requiere un nuevo levantamiento a detalle, validación de documentos, tipos de documentos y reglas que se le debe indicar al sistema para que sea un registro valido.\n\nLa tarea está realizando el equipo de procesos @Johnny Abarca .\nIgual se le ha indicado al proveedor pueda estimar los demás puntos mostrados para no detenernos.\n\n","created_at":"2026-07-27T17:37:00.000Z","updated_at":"2026-07-27T17:37:00.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"11041988731","replies":[],"assets":[]},{"id":"5402483708","text_body":"También se requiere reunión con ITConsol para solicitar cambio en el proceso de OC y sea consumido por el portal de Proveedores.","created_at":"2026-07-24T16:40:57.000Z","updated_at":"2026-07-24T16:40:57.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"11041988731","replies":[],"assets":[]},{"id":"5402318359","text_body":"En la implementación de la propuesta con SINTAD se identificaron algunos procesos adicionales involucrados como la generacion de Ordenes de venta que intercatua con SAP, la cual se realizó la especificacion y envio al proveedor para su atención.\n\nEn coordinaciones con ellos se viene aterrizando el alcance de esta segunda API necesaria para el API de ordenes.\n\nSe estima tener la proxima semana esta respuesta. (Hoy se tiene un reunion por la tarde)\n\nPor el lado del cliente aun no se tiene respuesta sobre los alcances solicitados: dato de Tipo de carga, Tipo de área, entre otros.\n\nHoy se enviará un recordatorio.","created_at":"2026-07-24T15:54:15.000Z","updated_at":"2026-07-24T15:54:15.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"11061239961","replies":[],"assets":[]},{"id":"5402273190","text_body":"Sin actividades al respecto en la ultima semana.","created_at":"2026-07-24T15:48:00.000Z","updated_at":"2026-07-24T16:03:00.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"11043427692","replies":[{"id":"5402353541","text_body":"El ToBe lo estamos levantando desde el día lunes 20. Por temas de cierre Contabilidad nos esta pidiendo recién agendar reuniones a partir de la próxima (a partir del 30/07). En base a eso estamos recién validando el flujo.","created_at":"2026-07-24T16:03:00.000Z","updated_at":"2026-07-24T16:03:00.000Z","creator":{"id":"105272946","name":"Johnny Abarca"}}],"assets":[]},{"id":"5402260100","text_body":"La semana pasada se concluyo con el relevamiento con los usuarios por parte del proveedor.\n\nSe recibió y actualizó la propuesta actualizada del proveedor y actualizó el gamma, sin embargo no especifica el esfuerzo en horas involucradas a las adecuaciones en general por las interfaces.\n\nPara el esfuerzo del proveedor por la implementación de las interfaces en un primer momento se le envio los contratos técnicos de las APIS involucradas, pero luego de la revisión y por los casos involucrados requiere las especificaciones tecnicas del caso.\n\nEstas especificaciones las debo enviar hoy.\n\nRespecto a la integracion con SINTAD el proveedor ha recomendado un tercero para que nos implemente aquella integracion, con quien nos reuninos este martes y ya tiene claro la necesidad e igualmente esta a la espera de la especificacion tecnica y los permisos para poder acceder a la BD (la misma que estoy evaluando su replica eo vpn para proporcionarla).\n\n","created_at":"2026-07-24T15:43:48.000Z","updated_at":"2026-07-24T15:43:48.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"12243759594","replies":[],"assets":[]},{"id":"5401918465","text_body":"El 16/07, Seidor envió la propuesta actualizada y estamos a la espera de la aprobación de Cristina.\n\nHoy se acaba de enviar un recordatorio para proceder con la planificación del proyecto.","created_at":"2026-07-24T14:17:55.000Z","updated_at":"2026-07-24T14:17:55.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"12002357229","replies":[],"assets":[]},{"id":"5401886397","text_body":"Se ha solicitado al proveedor tener una reunión para mostrarle el proceso levantado por @Johnny Abarca  y podemos definir si hay alguna desviación en el alcance o mantenemos la línea.\n\n\n\nLa reunión se ha programado para hoy viernes 24/07 a las 16:30 hrs.\nSe ha enviado la agenda correspondiente.\n","created_at":"2026-07-24T14:09:21.000Z","updated_at":"2026-07-24T14:13:37.000Z","creator":{"id":"97963889","name":"Juan Pablo Arbulú"},"item_id":"11041988731","replies":[],"assets":[]},{"id":"5393466862","text_body":"Se procedió a realizar la actualización del proceso, documentos y carga de formatos.","created_at":"2026-07-21T21:50:23.000Z","updated_at":"2026-07-22T23:02:56.000Z","creator":{"id":"105272946","name":"Johnny Abarca"},"item_id":"11041988731","replies":[{"id":"539711 pot360 y SAP, validando generacion de documento en EFACT, esta adecuando el sistema para permitir generacion de documentos manuales","created_at":"2026-09-23T15:39:33.000Z","updated_at":"2026-09-23T15:39:33.000Z","creator":{"id":"99222665","name":"Carlos Caycho Martinez"}}],"assets":[]},{"id":"5377225552","text_body":"Respecto a las especificaciones de las APIs se envió el 10/07 observaciones y se esta a la espera de respuestas sobre errores identificados en los documentos proporcionados. Hoy se envio un recordatorio.\n\nRespecto a la implementación en la aplicación se realizara sobre el TRACKING.","created_at":"2026-07-15T16:49:44.000Z","updated_at":"2026-07-15T16:49:44.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"12467678858","replies":[],"assets":[]},{"id":"5353389950","text_body":"Luego de reuniones con los usuarios de COSMOS y equipo técnico de Tottus, estamos elaborando el documento de especificación para su envío al proveedor.\n\nSe identifican algunos cambios en el proceso operativo para determinar la relación de las referencias con la factura comercial.\n\nSe distinguen dos etapas una para enviar la factura comercial y otra para enviar las liquidaciones.","created_at":"2026-07-07T15:16:45.000Z","updated_at":"2026-07-07T15:16:45.000Z","creator":{"id":"98564961","name":"Walter Gonzales"},"item_id":"12467678858","replies":[],"assets":[{"id":"3093972911","name":"image.png","url":"https://cosmos-digital-transformation.monday.com/protected_static/33168202/resources/3093972911/image.png","file_extension":".png","file_size":66703,"created_at":"2026-07-07T15:14:59Z"}]}]}</script>

  <script>
  'use strict';
  const D=JSON.parse(document.getElementById('snapshot').textContent);
  const C={priority:'color_mkzzg1vp',status:'status',sponsor:'color_mkzwb5e3',pm:'multiple_person_mm087pe3',progress:'numeric_mkzrc075',provider:'text_mm6b5rqp',start:'date_mkzt74dd',plan:'date_mkzrb4nr',gamma:'file_mm3amd88',real:'date_mm6d8mx',situation:'text_mm7fvxjn',mc:'numeric_mm6d2ctf',mo:'numeric_mm6dma87',mr:'formula_mm6dqzc2',capexExec:'numeric_mm6j1jmr',capexCommit:'numeric_mm6jwj01',opex:'numeric_mm6j8yx',budgetVarOld:'numeric_mm6jzmtq',capexOld:'numeric_mm6kwqt3',type:'color_mm6kys00',phase:'color_mm6kg2n5',risk:'color_mm6zdfgs',action:'long_text_mm6zs5rc',actionOwner:'multiple_person_mm6z7n01',actionDate:'date_mm6zeyj8',actionStatus:'color_mm6zq06e',forecast:'date_mm6zv2hs',budget:'numeric_mm6zy5pb',cost:'numeric_mm6zpew3',budgetRate:'formula_mm6dbyyn',benefits:'numeric_mm6z864h',benefitsDone:'numeric_mm6z8734',benefitsRate:'formula_mm6dp6xa',baseline:'numeric_mm6z45pc',scheduleVar:'formula_mm6z7hj2',progressVar:'formula_mm6zz4yh'};
  const S={owner:'person',status:'status',timeline:'timerange_mm59xyhd',start:'date_mm5esvwt',finish:'date_mm5ennwx',team:'color_mm5j6a06'};
  const views=[['resumen','Resumen ejecutivo'],['atencion','Riesgos y decisiones'],['portafolio','Portafolio'],['cronograma','Cronograma'],['finanzas','Finanzas y beneficios']];
  let state={view:'resumen',search:'',status:'',priority:'',pm:'',phase:'',schedule:'',issue:'',execPreset:'',myPm:'',regSearch:'',regPm:'',regCategory:'',regGroup:'pm'};
  const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const val=(i,id)=>{const x=i?.column_values?.[id];return x===null||x===undefined||String(x).trim()===''?null:String(x).trim()};
  const num=(i,id)=>{const x=val(i,id);if(x===null)return null;const n=Number(x);return Number.isFinite(n)?n:null};
  const fmtDate=x=>{if(!x)return'Sin dato';const d=new Date(String(x).length===10?x+'T12:00:00Z':x);return isNaN(d)?esc(x):new Intl.DateTimeFormat('es-PE',{timeZone:'America/Lima',day:'2-digit',month:'short',year:'numeric'}).format(d)};
  const fmtDT=x=>{const d=new Date(x);return new Intl.DateTimeFormat('es-PE',{timeZone:'America/Lima',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)+' · Lima'};
  const fmtNum=x=>new Intl.NumberFormat('es-PE',{maximumFractionDigits:2}).format(x);
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const active=i=>val(i,C.status)!=='Cerrado';
  const past=x=>x&&new Date(x+'T23:59:59Z')<new Date(D.extracted_at_utc);
  function closureInfo(i){const real=val(i,C.real);if(real){const year=Number(String(real).slice(0,4)),month=Number(String(real).slice(5,7)),quarter=Number.isFinite(month)?Math.ceil(month/3):null;return{date:real,year:Number.isFinite(year)?year:null,quarter,source:'fin_real'}}const h=D.closure_history&&D.closure_history[String(i.id)];if(!h)return null;const year=Number(h.year),quarter=Number(h.quarter);return{...h,year:Number.isFinite(year)?year:null,quarter:Number.isFinite(quarter)?quarter:null}}
  function closureLabel(i){const c=closureInfo(i);if(!c)return'Sin dato';return c.date?fmtDate(c.date):(c.year?String(c.year)+' · bitácora':'Sin dato')}
  function closureSourceLabel(i){const c=closureInfo(i);if(!c)return'Sin evidencia de cierre';return c.source==='fin_real'?'Fin Real registrado en monday':'Año del cambio a Cerrado en la bitácora de monday'}
  function attentionReasons(i){if(!active(i))return[];const r=[];const risk=(val(i,C.risk)||'').toLowerCase(),as=(val(i,C.actionStatus)||'').toLowerCase();if(risk.includes('bloqueo')&&!risk.includes('sin bloqueo'))r.push('Bloqueo: '+val(i,C.risk));else if(risk.includes('riesgo')||risk.includes('alerta'))r.push('Riesgo: '+val(i,C.risk));if(past(val(i,C.plan)))r.push('Fin Plan vencido');if(past(val(i,C.actionDate))&&!['completado','cerrado','no aplica'].includes(as))r.push('Acción vencida');return r}
  function flags(i){const r=[],s=val(i,C.status),p=num(i,C.progress);if(s==='Cerrado'&&!closureInfo(i))r.push(['Cierre sin fecha ni bitácora','red']);if(s==='Cerrado'&&!val(i,C.real)&&closureInfo(i))r.push(['Año recuperado de bitácora','blue']);if(s==='Cerrado'&&p!==null&&p!==100)r.push(['Cerrado con '+p+'%','amber']);if(active(i)&&!val(i,C.plan))r.push(['Activo sin Fin Plan','amber']);if(active(i)&&!val(i,C.start))r.push(['Activo sin Inicio','blue']);if(active(i)&&past(val(i,C.plan)))r.push(['Plan vencido','red']);return r}
  const pills=a=>'<div class="pills">'+a.map(x=>'<span class="pill '+esc(x[1]||'')+'">'+esc(x[0])+'</span>').join('')+'</div>';
  const statusPill=s=>'<span class="pill"><i class="status-dot '+esc((s||'').replace(/\s+/g,'-'))+'"></i>'+esc(s||'Sin dato')+'</span>';
  const projectButton=i=>'<button class="project-link" onclick="openProject(\''+i.id+'\')">'+esc(i.name)+'</button>';
  function head(k,t,d){return'<div class="heading"><div><span class="kicker">'+esc(k)+'</span><h1>'+esc(t)+'</h1><p>'+esc(d)+'</p></div></div>'}
  function nav(){const hasFinance=D.items.some(i=>[C.budget,C.cost,C.benefits,C.benefitsDone].some(id=>num(i,id)!==null)),primary=views.filter(([id])=>id!=='finanzas'||hasFinance);document.getElementById('nav').innerHTML=primary.map(([id,label])=>'<button class="'+(state.view===id?'active':'')+'" onclick="go(\''+id+'\')">'+label+'</button>').join('');const gapProjects=D.items.filter(i=>regularizationIssues(i).length).length;document.getElementById('secondary-nav').innerHTML='<details '+(state.view==='regularizacion'?'open':'')+'><summary>Gestión PMO</summary><button aria-label="Pendiente de regularizar en monday" class="'+(state.view==='regularizacion'?'active':'')+'" onclick="go(\'regularizacion\')">Pendiente de regularizar <span class="nav-badge">'+gapProjects+'</span></button></details>'}
  let moduleMotion=null,moduleMotionTicket=0;
  function prefersReducedMotion(){try{return typeof window.matchMedia==='function'&&window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}}
  function animateModule(){const main=document.getElementById('main');if(!main||typeof main.animate!=='function'||prefersReducedMotion())return;const ticket=++moduleMotionTicket;if(moduleMotion)moduleMotion.cancel();moduleMotion=main.animate([{opacity:.22,transform:'translateY(14px) scale(.995)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:440,easing:'cubic-bezier(.2,.78,.22,1)',fill:'both'});const children=[...main.children].slice(0,9);children.forEach((el,index)=>{if(typeof el.animate!=='function')return;el.animate([{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'translateY(0)'}],{duration:430,delay:Math.min(index*46,260),easing:'cubic-bezier(.2,.78,.22,1)',fill:'both'})});const visuals=main.querySelectorAll('.chart-bar .fill,.money-row .fill,.progress i,.stacked-track span,.column-bar,.donut');visuals.forEach((el,index)=>{if(typeof el.animate!=='function')return;const vertical=el.classList.contains('column-bar'),donut=el.classList.contains('donut');el.animate(donut?[{opacity:.2,transform:'scale(.82) rotate(-12deg)'},{opacity:1,transform:'scale(1) rotate(0)'}]:vertical?[{transform:'scaleY(0)'},{transform:'scaleY(1)'}]:[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:520,delay:120+Math.min(index*24,240),easing:'cubic-bezier(.2,.78,.22,1)',fill:'both'})});moduleMotion.finished.catch(()=>{}).then(()=>{if(ticket===moduleMotionTicket)moduleMotion=null})}
  function go(v){state.view=v;syncUrl();nav();render();animateModule();document.getElementById('main').focus();if(window.scrollTo)window.scrollTo({top:0,behavior:prefersReducedMotion()?'auto':'smooth'})}
  function goFiltered(v,filters={}){state.search='';state.status='';state.priority='';state.pm='';state.phase='';state.schedule='';state.issue='';Object.assign(state,filters);go(v)}

  function loadPreferences(){try{const saved=JSON.parse(localStorage.getItem('portfolio-preferences')||'{}');['view','execPreset','myPm','regGroup'].forEach(k=>{if(typeof saved[k]==='string')state[k]=saved[k]});state.myPm=localStorage.getItem('portfolio-my-pm')||state.myPm||''}catch(e){}try{if(typeof location!=='undefined'&&typeof URLSearchParams!=='undefined'){const q=new URLSearchParams(location.search);['view','search','status','priority','pm','phase','schedule','issue','execPreset','myPm','regSearch','regPm','regCategory','regGroup'].forEach(k=>{if(q.get(k)!==null)state[k]=q.get(k)});if(!['resumen','atencion','portafolio','cronograma','finanzas','regularizacion'].includes(state.view))state.view='resumen'}}catch(e){}}
  function syncUrl(){try{localStorage.setItem('portfolio-preferences',JSON.stringify({view:state.view,execPreset:state.execPreset,myPm:state.myPm,regGroup:state.regGroup}))}catch(e){}try{if(typeof location==='undefined'||typeof history==='undefined'||typeof URLSearchParams==='undefined')return;const q=new URLSearchParams();Object.entries(state).forEach(([k,v])=>{if(v&&!(k==='view'&&v==='resumen')&&!(k==='regGroup'&&v==='pm'))q.set(k,v)});const next=location.pathname+(q.toString()?'?'+q.toString():'')+(location.hash||'');history.replaceState(null,'',next)}catch(e){}}
  function setExecutivePreset(v){state.execPreset=v;syncUrl();render()}
  function setMyPm(v){state.myPm=v;try{localStorage.setItem('portfolio-my-pm',v)}catch(e){}if(state.execPreset==='mine')syncUrl();render()}
  function executiveScope(items){const now=new Date(D.extracted_at_utc),limit=new Date(now.getTime()+30*86400000);return items.filter(i=>{if(state.execPreset==='critical')return(val(i,C.priority)||'').toLowerCase().includes('critical');if(state.execPreset==='blocked'){const r=(val(i,C.risk)||'').toLowerCase();return r.includes('bloqueo')&&!r.includes('sin bloqueo')}if(state.execPreset==='next30'){const d=val(i,C.plan);return active(i)&&d&&new Date(d+'T23:59:59Z')>=now&&new Date(d+'T23:59:59Z')<=limit}if(state.execPreset==='mine')return !!state.myPm&&val(i,C.pm)===state.myPm;return true})}
  function executiveToolbar(){const pms=[...new Set(D.items.map(i=>val(i,C.pm)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es')),chip=(id,label)=>'<button class="quick-chip '+(state.execPreset===id?'active':'')+'" onclick="setExecutivePreset(\''+id+'\')">'+label+'</button>';return'<section class="executive-toolbar"><div class="quick-filters">'+chip('','Todos')+chip('critical','Críticos')+chip('blocked','Con bloqueo')+chip('next30','Próximos 30 días')+chip('mine','Mi cartera')+'</div><div class="portfolio-owner"><label for="my-pm">Mi PM</label><select id="my-pm" class="control" onchange="setMyPm(this.value)"><option value="">Seleccionar</option>'+pms.map(x=>'<option '+(state.myPm===x?'selected':'')+' value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select><button class="toolbar-button" onclick="copyViewLink(this)">Copiar vista</button></div></section>'}
  function copyViewLink(button){syncUrl();try{if(navigator&&navigator.clipboard){navigator.clipboard.writeText(location.href).then(()=>{button.textContent='Enlace copiado';setTimeout(()=>button.textContent='Copiar vista',1600)});return}}catch(e){}button.textContent='Vista lista'}

  document.getElementById('scope').textContent=D.items.filter(active).length+' activos · '+D.items.filter(i=>!active(i)).length+' cerrados · corte '+fmtDT(D.extracted_at_utc)+'.';
  document.getElementById('project-dialog').addEventListener('click',e=>{if(e.target.id==='project-dialog')e.target.close()});
  nav();render();animateModule();renderChatGuide();
  window.addEventListener('load',()=>{if(!window.cosmosFx)document.getElementById('chat-fallback').hidden=false});
  </script>
  <script id="apple-design-interactions">
    function toggleFullscreen() {
      const entering = !document.body.classList.contains('committee-mode');
      document.body.classList.toggle('committee-mode', entering);
      const root = document.documentElement;
      if (entering && !document.fullscreenElement && root.requestFullscreen) root.requestFullscreen().catch(() => {});
      if (!entering && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
      const button = document.getElementById('fullscreen-button');
      if (button) button.textContent = entering ? 'Salir de modo comité' : 'Modo comité';
    }
    function printExecutive(){window.print()}
    function closeMore(){const sheet=document.getElementById('more-sheet'),button=document.getElementById('more-button');if(!sheet||!button)return;sheet.hidden=true;button.setAttribute('aria-expanded','false')}
    function openMore(){const sheet=document.getElementById('more-sheet'),button=document.getElementById('more-button');if(!sheet||!button)return;const open=sheet.hidden;sheet.hidden=!open;button.setAttribute('aria-expanded',String(open))}
    function syncMobileNav(){document.querySelectorAll('[data-mobile-view]').forEach(button=>{if(button.dataset.mobileView===state.view)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')})}
    syncMobileNav();
    new MutationObserver(syncMobileNav).observe(document.getElementById('nav'),{childList:true});
    document.addEventListener('click',event=>{const sheet=document.getElementById('more-sheet');if(sheet&&!sheet.hidden&&!event.target.closest('#more-sheet,#more-button'))closeMore()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeMore();if(!document.getElementById('project-chat').hidden)toggleChat(false)}});
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && document.body.classList.contains('committee-mode')) {
        document.body.classList.remove('committee-mode');
        const button = document.getElementById('fullscreen-button');
        if (button) button.textContent = 'Modo comité';
      }
    });
  </script>
  <script src="assets/js/cosmos-paper-fx.min.js" defer></script>
  <script src="assets/js/portal-fx.js" defer></script>
