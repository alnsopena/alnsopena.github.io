name: Publicar Portafolio Ejecutivo IT
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id != '' && format('PMO PPT {0}', inputs.request_id) || github.workflow }}

on:
  push:
    branches: [main]
    paths:
      - "portafolio-ejecutivo-it/**"
      - "scripts/**"
      - "tools/weekly-ppt/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publicar-portafolio.yml"
      - "index.html"
      - "foto.jpg"
      - "pda-mockup/**"
  schedule:
    - cron: "17 * * * *"
    - cron: "0 14 * * 1" # Lunes 09:00, America/Lima. GitHub puede iniciar con retraso.
  workflow_dispatch:
    inputs:
      generate_ppt:
        description: "Generar otro borrador semanal con el corte actual de monday"
        type: boolean
        required: true
        default: true
      request_id:
        description: "Identificador de solicitud del portal PMO"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      site_ready: ${{ steps.pages_artifact.outcome }}
    steps:
      - name: Descargar sitio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probar reglas de datos y portal
        run: |
          node --test scripts/weekly-data.test.mjs scripts/encrypt-weekly-ppt.test.mjs scripts/deliver-weekly-ppt-cloud.test.mjs scripts/publish-weekly-ppt-pull.test.mjs scripts/write-ppt-config.test.mjs tools/weekly-ppt/apps-script-pull/test-pull.mjs tools/weekly-ppt/apps-script-dispatch/test-dispatch.mjs
          node scripts/test-cosmo.mjs

      - name: Verificar conexión de monday
        env:
          MONDAY_MCP_TOKEN: ${{ secrets.MONDAY_MCP_TOKEN }}
        run: |
          if [ -z "$MONDAY_MCP_TOKEN" ]; then
            echo "Falta MONDAY_MCP_TOKEN. Se detiene la publicación para no presentar un corte antiguo como actual."
            exit 1
          fi

      - name: Decidir si generar PPT semanal
        id: weekly
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          GENERATE_INPUT: ${{ inputs.generate_ppt }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE" == "0 14 * * 1" ]] || [[ "$EVENT_NAME" == "workflow_dispatch" && "$GENERATE_INPUT" == "true" ]]; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
          else
            echo "generate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar corte único de monday y sitio
        id: sync
        env:
          MONDAY_MCP_TOKEN: ${{ secrets.MONDAY_MCP_TOKEN }}
          GENERATE_WEEKLY_PPT: ${{ steps.weekly.outputs.generate == 'true' && '1' || '0' }}
        run: node scripts/sync-monday.mjs

      - name: Conservar corte y comparación semanal
        if: steps.sync.outcome == 'success'
        run: node scripts/update-weekly-baseline.mjs

      - name: Guardar referencia semanal cuando cambie
        if: steps.sync.outcome == 'success'
        run: |
          git add -A scripts/weekly-baseline.json
          if [ -d scripts/weekly-archive ]; then git add -A scripts/weekly-archive; fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: actualizar corte ejecutivo semanal [skip ci]"
            git push origin HEAD:main
          fi

      - name: Instalar generador PowerPoint
        if: steps.weekly.outputs.generate == 'true'
        run: npm ci --ignore-scripts

      - name: Probar generador PowerPoint
        if: steps.weekly.outputs.generate == 'true'
        run: node --test scripts/generate-weekly-ppt.test.mjs

      - name: Generar borrador editable con el mismo corte
        if: steps.weekly.outputs.generate == 'true'
        run: node scripts/generate-weekly-ppt.mjs --input _build/weekly-cut.json --output-dir _build/weekly-ppt

      - name: Cifrar borrador para entrega en Drive
        if: steps.weekly.outputs.generate == 'true'
        id: encrypted_ppt
        run: |
          encrypted_path="$(node scripts/encrypt-weekly-ppt.mjs --input "$(cat _build/weekly-ppt/latest-path.txt)" --certificate tools/weekly-ppt/delivery-certificate.pem --output-dir _build/weekly-ppt/encrypted)"
          echo "path=$encrypted_path" >> "$GITHUB_OUTPUT"
          echo "Borrador cifrado para entrega local: $(basename "$encrypted_path")" >> "$GITHUB_STEP_SUMMARY"

      - name: Conservar borrador cifrado para sincronización local
        if: steps.weekly.outputs.generate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-ppt-encrypted
          path: ${{ steps.encrypted_ppt.outputs.path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: true

      - name: Publicar borrador cifrado para consulta privada desde Apps Script
        if: steps.weekly.outputs.generate == 'true'
        env:
          PPT_PULL_KEY_B64: ${{ secrets.PPT_PULL_KEY_B64 }}
        run: |
          if [ -z "$PPT_PULL_KEY_B64" ]; then
            echo "Consulta privada pendiente de configuración; el artefacto CMS continúa disponible."
            exit 0
          fi
          node scripts/publish-weekly-ppt-pull.mjs --input "$(cat _build/weekly-ppt/latest-path.txt)"
          git add -A -- portafolio-ejecutivo-it/assets/weekly-ppt-pull
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: publicar borrador PPT cifrado [skip ci]"
            git push origin HEAD:main
          fi
          rm -rf _site/portafolio-ejecutivo-it/assets/weekly-ppt-pull
          cp -a portafolio-ejecutivo-it/assets/weekly-ppt-pull _site/portafolio-ejecutivo-it/assets/

      - name: Generar configuración pública de acceso a PPT
        if: always() && steps.sync.outcome == 'success'
        env:
          PPT_PULL_KEY_B64: ${{ secrets.PPT_PULL_KEY_B64 }}
          COSMOS_PPT_PULL_VERIFIED: ${{ vars.COSMOS_PPT_PULL_VERIFIED }}
          COSMOS_PPT_DISPATCH_URL: ${{ vars.COSMOS_PPT_DISPATCH_URL }}
        run: node scripts/write-ppt-config.mjs --output _site/portafolio-ejecutivo-it/assets/ppt-config.json

      - name: Configurar GitHub Pages
        if: always() && steps.sync.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Empaquetar solo el sitio público
        id: pages_artifact
        if: always() && steps.sync.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: always() && needs.build.outputs.site_ready == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
