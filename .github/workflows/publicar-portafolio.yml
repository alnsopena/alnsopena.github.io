name: Publicar Portafolio Ejecutivo IT

on:
  push:
    branches: [main]
    paths:
      - "portafolio-ejecutivo-it/**"
      - "scripts/sync-monday.mjs"
      - "scripts/closure-history-seed.json"
      - ".github/workflows/publicar-portafolio.yml"
      - "index.html"
      - "foto.jpg"
      - "pda-mockup/**"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar sitio
        uses: actions/checkout@v4

      - name: Preparar corte del portafolio
        env:
          MONDAY_MCP_TOKEN: ${{ secrets.MONDAY_MCP_TOKEN }}
        run: node scripts/sync-monday.mjs

      - name: Actualizar corte ejecutivo semanal
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u-%H)" = "1-13" ]; then
            node scripts/update-weekly-baseline.mjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/weekly-baseline.json
            git diff --cached --quiet || git commit -m "data: actualizar corte ejecutivo semanal [skip ci]"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
