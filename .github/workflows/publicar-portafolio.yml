name: Publicar Portafolio Ejecutivo IT

on:
  push:
    branches: [main]
    paths:
      - "portafolio-ejecutivo-it/**"
      - "scripts/sync-monday.mjs"
      - ".github/workflows/publicar-portafolio.yml"
      - "index.html"
      - "foto.jpg"
      - "pda-mockup/**"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar sitio
        uses: actions/checkout@v4

      - name: Preparar corte del portafolio
        env:
          MONDAY_MCP_TOKEN: ${{ secrets.MONDAY_MCP_TOKEN }}
        run: node scripts/sync-monday.mjs

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
